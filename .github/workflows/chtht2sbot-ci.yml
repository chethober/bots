# CI/CD for chtht2sbot: tests every pull request and push to main; after the
# tests pass on main, deploys to Telegram Serverless (tgcloud push) and applies
# the safe schema changes (tgcloud migrate --safe). Destructive schema changes
# are only listed in the log: apply them by hand with "npx tgcloud migrate".
# Needs the repository secret CHTHT2SBOT_TGCLOUD_TOKEN (the bot's tgcloud project token).
name: chtht2sbot CI/CD

on:
  push:
    branches: [main]
    paths: ['chtht2sbot/**', '.github/workflows/chtht2sbot-ci.yml']
  pull_request:
    paths: ['chtht2sbot/**', '.github/workflows/chtht2sbot-ci.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chtht2sbot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chtht2sbot/package-lock.json
      - run: npm ci
      - name: Syntax-check modules
        run: find tgcloud -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time: each push is conditional on the cloud's revision.
    concurrency:
      group: chtht2sbot-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: chtht2sbot
    env:
      TGCLOUD_TOKEN: ${{ secrets.CHTHT2SBOT_TGCLOUD_TOKEN }}
    steps:
      - name: Check TGCLOUD_TOKEN
        if: env.TGCLOUD_TOKEN == ''
        working-directory: .
        run: echo "::error::Set the CHTHT2SBOT_TGCLOUD_TOKEN repository secret" && exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chtht2sbot/package-lock.json
      - run: npm ci
      - name: Write tgcloud/lib/secrets.js
        run: |
          node -e 'const { SPOTIFY_CLIENT_ID: id, SPOTIFY_CLIENT_SECRET: secret } = process.env;
            if (!id || !secret) throw new Error("Set the CHTHT2SBOT_SPOTIFY_CLIENT_ID and CHTHT2SBOT_SPOTIFY_CLIENT_SECRET repository secrets");
            require("fs").writeFileSync("tgcloud/lib/secrets.js",
              `export const SPOTIFY_CLIENT_ID = ${JSON.stringify(id)};\nexport const SPOTIFY_CLIENT_SECRET = ${JSON.stringify(secret)};\n`)'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.CHTHT2SBOT_SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.CHTHT2SBOT_SPOTIFY_CLIENT_SECRET }}
      # .tgcloud/ is git-ignored: fetch the cloud snapshot and revision into a
      # fresh one so push sends only the diff and removes deleted modules.
      - run: mkdir -p .tgcloud && npx tgcloud fetch
      - run: npx tgcloud push
      - run: npx tgcloud migrate --safe
