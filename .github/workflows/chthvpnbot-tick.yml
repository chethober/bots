# Health checks for the community VPN bot (chthvpnbot): Telegram Serverless has
# no cron, so this runs one pass (re-check the VPNs checked longest ago, hide the
# ones that stopped answering, tell their owners) every 30 minutes. Needs the
# repository secret CHTHVPNBOT_TGCLOUD_TOKEN (the bot's tgcloud project token).
# GitHub runs scheduled workflows only from the default branch.
name: chthvpnbot tick

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: chthvpnbot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: chthvpnbot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chthvpnbot/package-lock.json
      - run: npm ci
      # hub.secrets.js is git-ignored: write it from the optional repository secrets
      # CHTH_HUB_URL and CHTHVPNBOT_HUB_SECRET (empty switches hub reporting off).
      - name: Write tgcloud/lib/hub.secrets.js
        run: |
          node -e 'const s = (k) => JSON.stringify(process.env[k] ?? "");
            require("fs").writeFileSync("tgcloud/lib/hub.secrets.js",
              `export const HUB_URL = ${s("HUB_URL")};\nexport const HUB_SECRET = ${s("HUB_SECRET")};\nexport const HUB_SOURCE = ${s("HUB_SOURCE")};\n`)'
        env:
          HUB_URL: ${{ secrets.CHTH_HUB_URL }}
          HUB_SECRET: ${{ secrets.CHTHVPNBOT_HUB_SECRET }}
          HUB_SOURCE: chthvpnbot
      - run: npx tgcloud run endpoints/tick '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.CHTHVPNBOT_TGCLOUD_TOKEN }}
