# CI/CD for chthapibot: tests every pull request and push to main; after the
# tests pass on main, deploys to Telegram Serverless (tgcloud push) and applies
# the safe schema changes (tgcloud migrate --safe). Destructive schema changes
# are only listed in the log: apply them by hand with "npx tgcloud migrate".
# Needs the repository secret CHTHAPIBOT_TGCLOUD_TOKEN (the bot's tgcloud project token).
name: chthapibot CI/CD

on:
  push:
    branches: [main]
    paths: ['chthapibot/**', '.github/workflows/chthapibot-ci.yml']
  pull_request:
    paths: ['chthapibot/**', '.github/workflows/chthapibot-ci.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chthapibot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chthapibot/package-lock.json
      - run: npm ci
      # hub_secrets.js is git-ignored; tests run with reporting off.
      - run: cp hub_secrets.example.js tgcloud/lib/hub_secrets.js
      - name: Syntax-check modules
        run: find tgcloud -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
    timeout-minutes: 10
    # One deploy at a time: each push is conditional on the cloud's revision.
    concurrency:
      group: chthapibot-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: chthapibot
    env:
      TGCLOUD_TOKEN: ${{ secrets.CHTHAPIBOT_TGCLOUD_TOKEN }}
    steps:
      - name: Check TGCLOUD_TOKEN
        if: env.TGCLOUD_TOKEN == ''
        working-directory: .
        run: echo "::error::Set the CHTHAPIBOT_TGCLOUD_TOKEN repository secret" && exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version comes from the tags, the notes from the commits since
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chthapibot/package-lock.json
      - run: npm ci
      # hub_secrets.js is git-ignored: write it from the optional repository secrets
      # CHTH_HUB_URL and CHTHAPIBOT_HUB_SECRET (empty switches hub reporting off).
      - name: Write tgcloud/lib/hub_secrets.js
        run: |
          node -e 'const s = (k) => JSON.stringify(process.env[k] ?? "");
            require("fs").writeFileSync("tgcloud/lib/hub_secrets.js",
              `export const HUB_URL = ${s("HUB_URL")};\nexport const HUB_SECRET = ${s("HUB_SECRET")};\nexport const HUB_SOURCE = ${s("HUB_SOURCE")};\n`)'
        env:
          HUB_URL: ${{ secrets.CHTH_HUB_URL }}
          HUB_SECRET: ${{ secrets.CHTHAPIBOT_HUB_SECRET }}
          HUB_SOURCE: chthapibot
      # .tgcloud/ is git-ignored: fetch the cloud snapshot and revision into a
      # fresh one so push sends only the diff and removes deleted modules.
      - run: mkdir -p .tgcloud && npx tgcloud fetch
      - run: npx tgcloud push
      - run: npx tgcloud migrate --safe
      # Every deploy that changes this bot is a release: chthapibot-vX.Y.Z, the patch number raised
      # by each. The CHTH hub posts it to the updates channel.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREFIX: chthapibot-
          RELEASE_TITLE: chthapibot
        run: node ../.github/scripts/release.mjs publish
