# Applies the bot profiles (descriptions and bios in every language, command
# menus) by running each bot's one-off setup endpoint. Run it by hand from the
# Actions tab after changing a profile text: deploying the code does not change
# what Telegram shows on a bot's profile, only the setup endpoint does.
# Needs each bot's <BOT>_TGCLOUD_TOKEN repository secret, like the deploys.
name: bot profiles

on:
  workflow_dispatch:
    inputs:
      bot:
        description: Which bot's profile to apply
        type: choice
        default: all
        options: [all, chsbrbot, chthapibot, chthbrbot, chthgamesbot, chthgrambot, chthmusicbot, chthvpnbot]

concurrency:
  group: bot-profiles
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(inputs.bot == 'all' && '["chsbrbot","chthapibot","chthbrbot","chthgamesbot","chthgrambot","chthmusicbot","chthvpnbot"]' || format('["{0}"]', inputs.bot)) }}
    defaults:
      run:
        working-directory: ${{ matrix.bot }}
    steps:
      # The secrets are named after the bot in capitals: CHTHVPNBOT_TGCLOUD_TOKEN.
      - id: name
        working-directory: .
        run: echo "upper=${BOT^^}" >> "$GITHUB_OUTPUT"
        env:
          BOT: ${{ matrix.bot }}
      - name: Check TGCLOUD_TOKEN
        working-directory: .
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then echo "::error::Set the ${UPPER}_TGCLOUD_TOKEN repository secret" && exit 1; fi
        env:
          UPPER: ${{ steps.name.outputs.upper }}
          TGCLOUD_TOKEN: ${{ secrets[format('{0}_TGCLOUD_TOKEN', steps.name.outputs.upper)] }}
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.bot }}/package-lock.json
      - run: npm ci
      # `tgcloud run` runs the checked-out modules, so the git-ignored files are
      # written here the same way the deploys write them.
      - name: Write tgcloud/lib/hub_secrets.js
        run: |
          node -e 'const s = (k) => JSON.stringify(process.env[k] ?? "");
            require("fs").writeFileSync("tgcloud/lib/hub_secrets.js",
              `export const HUB_URL = ${s("HUB_URL")};\nexport const HUB_SECRET = ${s("HUB_SECRET")};\nexport const HUB_SOURCE = ${s("HUB_SOURCE")};\n`)'
        env:
          HUB_URL: ${{ secrets.CHTH_HUB_URL }}
          HUB_SECRET: ${{ secrets[format('{0}_HUB_SECRET', steps.name.outputs.upper)] }}
          HUB_SOURCE: ${{ matrix.bot }}
      - name: Write tgcloud/lib/secrets.js (chsbrbot)
        if: matrix.bot == 'chsbrbot'
        run: |
          node -e 'const s = (k) => JSON.stringify(process.env[k] ?? "");
            require("fs").writeFileSync("tgcloud/lib/secrets.js",
              `export const NVD_API_KEY = ${s("NVD_API_KEY")};\nexport const GITHUB_TOKEN = ${s("GH_POC_TOKEN")};\n`)'
        env:
          NVD_API_KEY: ${{ secrets.CHSBRBOT_NVD_API_KEY }}
          GH_POC_TOKEN: ${{ secrets.CHSBRBOT_GITHUB_TOKEN }}
      - name: Write tgcloud/lib/secrets.js (chthgamesbot)
        if: matrix.bot == 'chthgamesbot'
        run: |
          node -e 'const { BUTTON_SECRET, ADMIN_IDS } = process.env;
            if (!BUTTON_SECRET) throw new Error("Set the CHTHGAMESBOT_BUTTON_SECRET repository secret");
            const ids = JSON.parse(ADMIN_IDS || "[]");
            if (!Array.isArray(ids) || !ids.every(Number.isInteger)) throw new Error("CHTHGAMESBOT_ADMIN_IDS must be a JSON array of integers");
            require("fs").writeFileSync("tgcloud/lib/secrets.js",
              `export const BUTTON_SECRET = ${JSON.stringify(BUTTON_SECRET)};\nexport const ADMIN_IDS = ${JSON.stringify(ids)};\n`)'
        env:
          BUTTON_SECRET: ${{ secrets.CHTHGAMESBOT_BUTTON_SECRET }}
          ADMIN_IDS: ${{ secrets.CHTHGAMESBOT_ADMIN_IDS }}
      - name: Write tgcloud/lib/secrets.js (chthmusicbot)
        if: matrix.bot == 'chthmusicbot'
        run: |
          node -e 'const keys = ["SPOTIFY_CLIENT_ID", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "APPLE_MUSIC_DEVELOPER_TOKEN", "SONGLINK_API_KEY"];
            require("fs").writeFileSync("tgcloud/lib/secrets.js",
              keys.map((k) => `export const ${k} = ${JSON.stringify(process.env[k] ?? "")};\n`).join(""))'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.CHTHMUSICBOT_SPOTIFY_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.CHTHMUSICBOT_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.CHTHMUSICBOT_GOOGLE_CLIENT_SECRET }}
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.CHTHMUSICBOT_APPLE_MUSIC_DEVELOPER_TOKEN }}
          SONGLINK_API_KEY: ${{ secrets.CHTHMUSICBOT_SONGLINK_API_KEY }}
      - name: Apply the profile
        if: matrix.bot != 'chthgamesbot'
        run: npx tgcloud run endpoints/setup '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets[format('{0}_TGCLOUD_TOKEN', steps.name.outputs.upper)] }}
      # The games bot keeps its setup in scripts/: it runs as a temporary endpoint.
      # The avatar is left as it is, and a failed step is reported in the output
      # instead of thrown, so the output is checked.
      - name: Apply the profile (chthgamesbot)
        if: matrix.bot == 'chthgamesbot'
        run: |
          set -o pipefail
          cp scripts/setup.js tgcloud/endpoints/zsetup.js
          npx tgcloud run endpoints/zsetup '{ skipPhoto: true }' --ctx '{ initData: { user: { id: 0 } } }' | tee setup.log
          if grep -q 'ERROR: ' setup.log; then echo "::error::A setup step failed, see the output above" && exit 1; fi
        env:
          TGCLOUD_TOKEN: ${{ secrets.CHTHGAMESBOT_TGCLOUD_TOKEN }}
