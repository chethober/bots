name: chthgamesbot test
on:
  push:
    paths: ['chthgamesbot/**', '.github/workflows/chthgamesbot-test.yml']
  pull_request:
    paths: ['chthgamesbot/**', '.github/workflows/chthgamesbot-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chthgamesbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chthgamesbot/package-lock.json
      - run: npm ci
      - run: cp secrets.example.js tgcloud/lib/secrets.js
      - run: npm test
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run test:ui
