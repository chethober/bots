<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotify sign-in</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888); --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc); --btn-text: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 21px; margin: 4px 0 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 14px 0; }
  code { word-break: break-all; font-size: 13px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; background: var(--btn); color: var(--btn-text); cursor: pointer; margin-top: 10px; }
  button.secondary { background: transparent; color: var(--link); padding: 8px; }
  .err { color: #d33; }
</style>
</head>
<body>
<main id="app"><p>…</p></main>
<script>
// Spotify sends the user back here with ?code&state. Inside the Mini App the
// Telegram session survives the round trip (telegram-web-app.js keeps it in
// sessionStorage), so the code goes straight to spotifyFinish. In a browser
// there is no session: show a /connect message to send to the bot instead.
const BOT = 'chthmusicbot';
const tg = window.Telegram?.WebApp;
tg?.ready();
const L = {
  en: { done: '✅ Spotify connected! You can close this page.', send: 'Almost done: send this message to the bot.', open: 'Open the bot', copy: 'Copy', copied: 'Copied ✓', denied: 'Sign-in was cancelled.' },
  fa: { done: '✅ اسپاتیفای وصل شد! می‌تونی این صفحه رو ببندی.', send: 'تقریباً تمومه: این پیام رو برای بات بفرست.', open: 'باز کردن بات', copy: 'کپی', copied: 'کپی شد ✓', denied: 'ورود لغو شد.' },
  ar: { done: '✅ تم ربط Spotify! يمكنك إغلاق هذه الصفحة.', send: 'اقتربت: أرسل هذه الرسالة إلى البوت.', open: 'افتح البوت', copy: 'نسخ', copied: 'تم النسخ ✓', denied: 'أُلغي تسجيل الدخول.' },
  ru: { done: '✅ Spotify подключён! Эту страницу можно закрыть.', send: 'Почти готово: отправь это сообщение боту.', open: 'Открыть бота', copy: 'Копировать', copied: 'Скопировано ✓', denied: 'Вход отменён.' },
  es: { done: '✅ ¡Spotify conectado! Puedes cerrar esta página.', send: 'Casi listo: envía este mensaje al bot.', open: 'Abrir el bot', copy: 'Copiar', copied: 'Copiado ✓', denied: 'Se canceló el inicio de sesión.' },
};
const lang = (tg?.initDataUnsafe?.user?.language_code || navigator.language || 'en').slice(0, 2).toLowerCase();
const S = L[lang] || L.en;
if (lang === 'fa' || lang === 'ar') document.documentElement.dir = 'rtl';
const app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const q = new URLSearchParams(location.search);
const code = q.get('code');
const state = q.get('state');

function sendToBot() {
  const command = `/connect ${state} ${code}`;
  app.innerHTML = `<h1>${S.send}</h1><div class="card"><code id="cmd">${esc(command)}</code><button class="secondary" id="copy">${S.copy}</button></div>
    <a href="https://t.me/${BOT}?text=${encodeURIComponent(command)}"><button>${S.open}</button></a>`;
  document.getElementById('copy').onclick = async (ev) => {
    try { await navigator.clipboard.writeText(command); } catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('cmd')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
    ev.target.textContent = S.copied;
  };
}

if (q.get('error') || !code || !state) {
  app.innerHTML = `<p class="err">${S.denied}</p>`;
} else if (tg?.initData) {
  tg.Serverless.call('spotifyFinish', { state, code }, (err) => {
    if (!err) {
      app.innerHTML = `<h1>${S.done}</h1>`;
      setTimeout(() => tg.close(), 1500);
    } else if (err.type === 'ENDPOINT_ERROR') {
      app.innerHTML = `<p class="err">${esc(err.message)}</p>`;
    } else {
      sendToBot();
    }
  });
} else {
  sendToBot();
}
</script>
</body>
</html>
