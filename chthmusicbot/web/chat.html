<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chat music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="./miniapp.css">
<style>
  /* Apple's design tokens: system colors, labels, fills, materials and the
     iOS type scale, in light and dark. The theme follows Telegram's.
     CHTH kit tokens (miniapp.css) are available as --chth-* alongside. */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, "Segoe UI", Roboto, "Vazirmatn", sans-serif;
    --large-title: 700 34px/41px var(--font); --title1: 700 28px/34px var(--font); --title2: 700 22px/28px var(--font);
    --title3: 600 20px/25px var(--font); --headline: 600 17px/22px var(--font); --body: 400 17px/22px var(--font);
    --callout: 400 16px/21px var(--font); --subhead: 400 15px/20px var(--font); --footnote: 400 13px/18px var(--font);
    --caption1: 400 12px/16px var(--font); --caption2: 400 11px/13px var(--font);
    --r-xs: 8px; --r-s: 12px; --r-m: 18px; --r-l: 26px; --r-xl: 34px;
    --ease: cubic-bezier(.32, .72, 0, 1);
    --tab: 64px;
  }
  :root[data-theme="light"] {
    --pink: #FF2D55; --red: #FF3B30; --orange: #FF9500; --green: #34C759; --blue: #007AFF; --indigo: #5856D6; --purple: #AF52DE; --gray: #8E8E93;
    --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3); --label4: rgba(60,60,67,.18);
    --bg: #F2F2F7; --bg2: #FFFFFF; --sep: rgba(60,60,67,.29);
    --fill: rgba(120,120,128,.2); --fill2: rgba(120,120,128,.16); --fill3: rgba(118,118,128,.12); --fill4: rgba(116,116,128,.08);
    --material: rgba(255,255,255,.62); --glass: rgba(255,255,255,.42); --glass-strong: rgba(255,255,255,.72);
    --rim: rgba(255,255,255,.95); --rim2: rgba(255,255,255,.35); --shade: rgba(0,0,0,.10); --aura: .3;
    --thumb: #FFFFFF;
  }
  :root[data-theme="dark"] {
    --pink: #FF375F; --red: #FF453A; --orange: #FF9F0A; --green: #30D158; --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2; --gray: #8E8E93;
    --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --label4: rgba(235,235,245,.16);
    --bg: #000000; --bg2: #1C1C1E; --sep: rgba(84,84,88,.6);
    --fill: rgba(120,120,128,.36); --fill2: rgba(120,120,128,.32); --fill3: rgba(118,118,128,.24); --fill4: rgba(118,118,128,.18);
    --material: rgba(30,30,32,.56); --glass: rgba(255,255,255,.08); --glass-strong: rgba(255,255,255,.16);
    --rim: rgba(255,255,255,.55); --rim2: rgba(255,255,255,.12); --shade: rgba(0,0,0,.45); --aura: .45;
    --thumb: #636366;
  }
  :root { --tint: var(--pink); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); transition: background .3s; }
  html, body { margin: 0; min-height: 100%; color: var(--label); font: var(--body); letter-spacing: -.41px; -webkit-font-smoothing: antialiased; }
  body { padding-bottom: calc(var(--tab) + 92px + env(safe-area-inset-bottom)); overflow-x: hidden; }
  button { font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }
  svg.i { width: 22px; height: 22px; flex: none; display: block; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Liquid Glass: a clear, refracting layer with a specular rim. Controls float
     on it; content sits on the thicker material below. */
  .glass, .material { position: relative; isolation: isolate; -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%); }
  .glass { background: radial-gradient(130% 90% at 18% 0%, var(--rim2), transparent 55%), var(--glass); box-shadow: 0 10px 30px var(--shade), 0 1px 2px var(--shade), inset 0 1px 1px var(--rim2), inset 0 -1px 2px rgba(255,255,255,.06); }
  .material { background: var(--material); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); box-shadow: 0 1px 0 var(--rim2) inset; }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
    background: linear-gradient(150deg, var(--rim) 0%, transparent 32%, transparent 68%, var(--rim2) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .press { transition: transform .35s var(--ease), background .2s; }
  .press:active { transform: scale(.94); }

  /* Backdrop: soft color from the chat, like Apple Music's moving art. */
  .aura { position: fixed; inset: -25% -35% auto; height: 75vh; z-index: -1; pointer-events: none; filter: blur(70px) saturate(140%); opacity: var(--aura); }
  .aura i { position: absolute; width: 62%; height: 70%; border-radius: 50%; animation: drift 20s ease-in-out infinite alternate; }
  .aura i:nth-child(1) { left: 8%; top: 0; background: var(--c1, var(--pink)); }
  .aura i:nth-child(2) { right: 4%; top: 22%; background: var(--c2, var(--indigo)); animation-duration: 26s; animation-direction: alternate-reverse; }
  @keyframes drift { to { transform: translate(10%, 12%) scale(1.15); } }

  /* Navigation: an iOS large title. */
  header { padding: 18px 20px 4px; }
  .sub { font: var(--footnote); color: var(--label2); display: flex; align-items: center; gap: 6px; letter-spacing: -.08px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
  h1 { font: var(--large-title); letter-spacing: .37px; margin: 4px 0 0; overflow-wrap: anywhere; }
  h1 .topic { display: block; font: var(--title3); color: var(--label2); margin-top: 2px; letter-spacing: .38px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font: 600 13px/1 var(--font); letter-spacing: -.08px; max-width: 100%; }
  .chip b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip svg.i { width: 14px; height: 14px; color: var(--orange); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  section { padding: 0 16px; }
  .h2 { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 4px 10px; }
  .h2 h2 { font: var(--title2); letter-spacing: .35px; margin: 0; }
  .h2 span { font: var(--subhead); color: var(--label2); }
  .foot { font: var(--footnote); color: var(--label2); margin: 10px 16px; letter-spacing: -.08px; }
  .err { color: var(--red); }
  .caps { font: 600 12px/16px var(--font); letter-spacing: .4px; text-transform: uppercase; color: var(--label2); }

  /* Artwork: real covers, or a gradient made from the song's name. */
  .art { position: relative; width: 48px; height: 48px; border-radius: var(--r-xs); flex: none; background: var(--cv) center/cover no-repeat; display: grid; place-items: center; overflow: hidden; color: rgba(255,255,255,.92); font: 600 18px var(--font); box-shadow: 0 0 0 .5px var(--label4) inset; }
  .art .pi { position: absolute; inset-block-end: 4px; inset-inline-end: 4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.45); }
  .art .pi svg { width: 11px; height: 11px; }
  .art.playing .pi { background: var(--tint); }

  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 11px; }
  .eq i { width: 2.5px; border-radius: 2px; background: var(--tint); animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 11px; } }

  /* Now playing */
  .np { margin: 16px 16px 0; padding: 14px; border-radius: var(--r-l); display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
  .np .art { width: 64px; height: 64px; border-radius: var(--r-s); box-shadow: 0 6px 16px var(--shade); }
  .np .who { font: var(--caption1); color: var(--label2); display: flex; gap: 6px; align-items: center; }
  .np .t { font: var(--headline); letter-spacing: -.43px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .a { font: var(--subhead); color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.24px; }
  .np .ctl { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 40px; direction: ltr; padding: 4px 0 2px; }
  .np .ctl button { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; color: var(--label); }
  .np .ctl button:active { background: var(--fill3); }
  .np .ctl svg { width: 30px; height: 30px; }
  .np .ctl .big svg { width: 38px; height: 38px; }
  .np .next { grid-column: 1 / -1; font: var(--footnote); color: var(--label2); border-top: .5px solid var(--sep); padding-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .next b { color: var(--label); font-weight: 500; }

  /* Search field */
  .search { position: relative; margin-top: 16px; }
  .search svg.i { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--label2); pointer-events: none; z-index: 3; }
  .search input { width: 100%; height: 48px; padding: 0 16px; padding-inline-start: 42px; font: var(--body); letter-spacing: -.41px; color: var(--label); background: transparent; border: 0; border-radius: 999px; outline: none; -webkit-appearance: none; appearance: none; position: relative; z-index: 1; }
  .search input::placeholder { color: var(--label2); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search .glass { position: absolute; inset: 0; border-radius: 999px; transition: box-shadow .25s; }
  .search input:focus + .glass { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tint) 35%, transparent), 0 10px 30px var(--shade); }

  /* Inset grouped lists */
  .list { border-radius: var(--r-l); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 14px; min-height: 64px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; inset-inline-start: 74px; inset-inline-end: 0; height: .5px; background: var(--sep); }
  .row.on .meta .t { color: var(--tint); }
  .meta { flex: 1; min-width: 0; }
  .meta .t { font: var(--body); letter-spacing: -.41px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .s { font: var(--subhead); letter-spacing: -.24px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { display: flex; gap: 0; flex: none; align-items: center; }
  .ib { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--label2); }
  .ib svg { width: 18px; height: 18px; }
  .ib:active { background: var(--fill3); }
  .ib.del:active { color: var(--red); }
  .ib.add { color: var(--tint); }
  .ib.add svg { width: 28px; height: 28px; }

  /* Up next */
  .hero { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: var(--r-l); margin-bottom: 10px; }
  .hero .art { width: 84px; height: 84px; border-radius: var(--r-s); box-shadow: 0 8px 20px var(--shade); font-size: 28px; }
  .hero .k { font: 600 11px/13px var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--tint); }
  .hero .t { font: var(--title3); letter-spacing: .38px; margin: 3px 0 1px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Buttons: capsules, prominent (tinted glass) and plain glass */
  .btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 52px; padding: 0 20px; border-radius: 999px; font: var(--headline); letter-spacing: -.43px; color: var(--label); }
  .btn svg.i { width: 18px; height: 18px; }
  .btn.prominent { color: #fff; background: radial-gradient(120% 120% at 25% 0%, rgba(255,255,255,.35), transparent 55%), var(--tint); box-shadow: 0 10px 26px color-mix(in srgb, var(--tint) 40%, transparent), inset 0 1px 1px rgba(255,255,255,.45), inset 0 -1px 1px rgba(0,0,0,.12); }
  .btn.plain { height: 44px; color: var(--tint); font-weight: 400; }
  .btn.plain.bad { color: var(--red); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

  /* Playlists */
  .pl { border-radius: var(--r-l); padding: 16px; margin-bottom: 10px; }
  .pl .top { display: flex; gap: 12px; align-items: flex-start; }
  .pl .badge-svc { width: 44px; height: 44px; border-radius: var(--r-s); display: grid; place-items: center; flex: none; background: var(--sc); color: #fff; box-shadow: 0 6px 14px color-mix(in srgb, var(--sc) 40%, transparent); }
  .pl .name { font: var(--headline); letter-spacing: -.43px; overflow-wrap: anywhere; }
  .pl .sv { font: var(--subhead); color: var(--label2); letter-spacing: -.24px; }
  .pl .stats { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--fill3); font: 500 13px/1 var(--font); color: var(--label2); letter-spacing: -.08px; }
  .pill b { color: var(--label); font-weight: 600; }
  .pill.btnish { margin-inline-start: auto; color: var(--tint); font-weight: 600; }
  .pl .tracks { margin-top: 12px; border-radius: var(--r-m); overflow: hidden; background: var(--fill4); }
  .chev { transition: transform .35s var(--ease); width: 14px !important; height: 14px !important; }
  .chev.open { transform: rotate(180deg); }

  /* Sheet: the "link a playlist" form, with iOS controls */
  .sheet { border-radius: var(--r-xl); padding: 8px 16px 16px; margin-top: 12px; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 12px; }
  .sheet h3 { font: var(--headline); text-align: center; margin: 0 0 6px; letter-spacing: -.43px; }
  .gh { margin: 20px 12px 7px; }
  .group { border-radius: var(--r-m); overflow: hidden; background: var(--fill4); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 14px; text-align: start; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; inset-inline-start: 14px; inset-inline-end: 0; height: .5px; background: var(--sep); }
  .opt:active { background: var(--fill3); }
  .opt .check { width: 18px; height: 18px; color: var(--tint); opacity: 0; flex: none; }
  .opt[aria-checked="true"] .check { opacity: 1; }
  .opts { max-height: 290px; overflow-y: auto; }
  .seg { display: grid; grid-template-columns: repeat(var(--n), 1fr); padding: 2px; border-radius: 10px; background: var(--fill3); position: relative; }
  .seg button { height: 32px; border-radius: 8px; font: 500 13px/1 var(--font); letter-spacing: -.08px; color: var(--label); display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; overflow: hidden; padding: 0 6px; }
  .seg button[aria-pressed="true"] { background: var(--thumb); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04), inset 0 0 0 .5px rgba(0,0,0,.04); }
  .toggle { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 14px; text-align: start; font: var(--body); }
  .toggle span { flex: 1; }
  .switch { width: 51px; height: 31px; border-radius: 999px; background: var(--fill); flex: none; position: relative; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: inset-inline-start .3s var(--ease); }
  .toggle[aria-checked="true"] .switch { background: var(--green); }
  .toggle[aria-checked="true"] .switch::after { inset-inline-start: 22px; }

  /* Picks */
  .feature { position: relative; border-radius: var(--r-l); overflow: hidden; isolation: isolate; padding: 18px; min-height: 230px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; margin-top: 8px; box-shadow: 0 14px 34px var(--shade); }
  .feature::before { content: ""; position: absolute; inset: 0; background: var(--cv) center/cover; z-index: -2; }
  .feature::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 25%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.72)); }
  .feature .k { font: 600 11px/13px var(--font); letter-spacing: .6px; text-transform: uppercase; opacity: .8; }
  .feature .t { font: var(--title1); letter-spacing: .36px; margin-top: 4px; }
  .feature .a { font: var(--callout); opacity: .85; }
  .feature .why { color: rgba(255,255,255,.75); }
  .feature .bar { display: flex; gap: 10px; margin-top: 14px; }
  .feature .bar .btn { width: auto; height: 44px; padding: 0 18px; color: #fff; }
  .feature .bar .btn.glass { background: radial-gradient(130% 90% at 18% 0%, rgba(255,255,255,.35), transparent 55%), rgba(255,255,255,.16); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; margin-top: 18px; }
  .tile { min-width: 0; }
  .tile .art { width: 100%; height: auto; aspect-ratio: 1; border-radius: 10px; font-size: 40px; box-shadow: 0 8px 20px var(--shade); }
  .tile .art .pi { inset-block-end: 8px; inset-inline-end: auto; inset-inline-start: 8px; width: 30px; height: 30px; }
  .tile .art .pi svg { width: 13px; height: 13px; }
  .tile .fab { position: absolute; inset-block-end: 8px; inset-inline-end: 8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; z-index: 2; background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(10px) saturate(180%); backdrop-filter: blur(10px) saturate(180%); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.5), 0 4px 10px rgba(0,0,0,.2); }
  .tile .fab svg { width: 15px; height: 15px; }
  .tile .t { font: 500 13px/18px var(--font); letter-spacing: -.08px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { font: var(--footnote); color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.08px; }
  .why { display: flex; align-items: center; gap: 4px; font: var(--caption1); color: var(--label2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .why svg.i { width: 11px; height: 11px; color: var(--tint); }

  /* Sleep: the Clock app's timer */
  .timer { border-radius: var(--r-xl); padding: 24px 16px 20px; margin-top: 16px; text-align: center; }
  .dial { position: relative; width: 236px; height: 236px; margin: 0 auto; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial .in { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
  .dial .clock { font: 200 54px/1 var(--font); letter-spacing: -1px; }
  .dial .cap { font: var(--subhead); color: var(--label2); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .dial .cap svg { width: 14px; height: 14px; color: var(--orange); }
  .dial .idle svg { width: 44px; height: 44px; margin: 0 auto 6px; color: var(--orange); }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
  .preset { aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; line-height: 1; }
  .preset b { font: 400 22px/1 var(--font); display: block; letter-spacing: .35px; }
  .preset small { font: var(--caption2); color: var(--label2); margin-top: 3px; display: block; }
  .cancel { margin: 14px auto 0; width: auto; padding: 0 26px; height: 44px; color: var(--red); }

  /* Empty states and placeholders */
  .empty { text-align: center; padding: 34px 24px; color: var(--label2); font: var(--subhead); }
  .empty svg.i { width: 50px; height: 50px; margin: 0 auto 12px; color: var(--label3); }
  .sk { height: 64px; border-radius: var(--r-m); background: linear-gradient(90deg, var(--fill4), var(--fill3), var(--fill4)) 0 0/200% 100%; animation: sk 1.3s linear infinite; }
  .sk + .sk { margin-top: 8px; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* Tab bar: a floating glass capsule; the current tab sits under a glass lens. */
  .tabbar { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--tab); border-radius: 999px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px; }
  .tabbar button { position: relative; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--label); font: 500 10px/12px var(--font); letter-spacing: .1px; min-width: 0; z-index: 3; transition: color .25s; }
  .tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .tabbar button svg.i { width: 24px; height: 24px; }
  .tabbar button[aria-selected="true"] { color: var(--tint); }

function applyTheme() {
  const dark = tg?.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  const bg = dark ? '#000000' : '#F2F2F7';
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor?.(bg); } catch {}

const ic = (name, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[name]}</svg>`;
const EQ = '<span class="eq"><i></i><i></i><i></i></span>';
const SVC_COLOR = { spotify: '#1DB954', youtube: '#FF0033', apple: '#FA2D48' };

function hue(s) { let h = 0; for (const c of String(s ?? '')) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
const gradOf = (s) => { const h = hue(s); return `linear-gradient(160deg, hsl(${h} 78% 62%), hsl(${(h + 40) % 360} 70% 42%))`; };
const cssUrl = (u) => String(u).replace(/["'()\\\s]/g, (c) => encodeURIComponent(c));
const initial = (s) => esc([...String(s ?? '♪').trim()][0] ?? '♪').toUpperCase();
const coverBg = (song) => (song.artwork ? `url(&quot;${esc(cssUrl(song.artwork))}&quot;)` : gradOf(`${song.title}${song.artist}`));

// --- calls -------------------------------------------------------------------------
function call(op, input = {}) {
  return new Promise((resolve, reject) => tg.Serverless.call('chatApp', { op, chat: chatParam, ...input }, (err, res) => (err ? reject(err) : resolve(res))));
}
const errText = (e) => (e?.parameters?.code && (S[`err_${e.parameters.code}`] || L.en[`err_${e.parameters.code}`])) || e?.message || String(e);

let toastTimer;
function toast(text, kind = 'success') {
  const el = document.getElementById('toast');
  el.innerHTML = `${ic(kind === 'error' ? 'warn' : 'checkCircle')}<span>${esc(text)}</span>`;
  el.classList.toggle('bad', kind === 'error'); el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  try { tg.HapticFeedback.notificationOccurred(kind); } catch {}
}

async function act(btn, op, input, { ok } = {}) {
  if (btn) btn.disabled = true;
  try {
    const res = await call(op, input);
    if (res?.chat) state = res;
    if (ok) toast(typeof ok === 'function' ? ok(res) : ok);
    render();
    return res;
  } catch (e) {
    toast(errText(e), 'error');
    if (e?.parameters?.code === 'NOT_FOUND') refresh();
    return null;
  } finally {
    if (btn) btn.disabled = false;
  }
}

}

// --- preview player (30-second clips) -------------------------------------------------
const audio = new Audio();
let previewing = null;
function setPreview(song) {
  const mini = document.getElementById('mini');
  if (!song) { audio.pause(); previewing = null; mini.hidden = true; markPlaying(); return; }
  previewing = song;
  audio.src = song.preview; audio.play().catch(() => toast('▶︎ ✕', 'error'));
  mini.innerHTML = `<div class="art" style="--cv:${coverBg(song)}">${song.artwork ? '' : initial(song.title)}</div>
    <div class="meta"><div class="t">${esc(song.title)}</div><div class="s">${EQ}<span>${esc(song.artist ?? '')}</span></div></div>
    <button class="ib add press" id="miniAdd" aria-label="+">${ic('plusCircle')}</button><button class="ib press" id="miniStop" aria-label="stop">${ic('pause')}</button>
    <div class="prog"><i id="prog"></i></div>`;
  mini.hidden = false;
  document.getElementById('miniStop').onclick = () => setPreview(null);
  document.getElementById('miniAdd').onclick = (e) => act(e.currentTarget, 'queueAdd', { song }, { ok: tr('added') });
  markPlaying();
}
audio.addEventListener('timeupdate', () => { const p = document.getElementById('prog'); if (p) p.style.width = `${(audio.currentTime / (audio.duration || 30)) * 100}%`; });
audio.addEventListener('ended', () => setPreview(null));
function markPlaying() {
  document.querySelectorAll('[data-preview]').forEach((el) => {
    const on = Boolean(previewing) && el.dataset.preview === previewing.preview;
    el.classList.toggle('playing', on);
    const pi = el.querySelector('.pi');
    if (pi) pi.innerHTML = ic(on ? 'pause' : 'play');
    el.closest('.row')?.classList.toggle('on', on);
  });
}

let songSeq = 0;
function keep(song) { const k = `s${++songSeq}`; songs.set(k, song); return k; }

function art(song, k) {

function sleepView() {
  const s = state.sleep;
  const p = state.player;
  const canSet = p ? state.me.control : state.me.spotify;
  const R = 104;
  const C = 2 * Math.PI * R;
  const left = s ? Math.max(0, Math.round(s.at - serverNow())) : 0;
  const total = s ? Math.max(1, s.at - (s.from ?? s.at - 3600)) : 1;
  let html = heading(bare('tab_sleep'));
  html += `<div class="timer material fade">
    <div class="dial"><svg viewBox="0 0 236 236"><circle cx="118" cy="118" r="${R}" stroke="var(--fill3)" stroke-width="9" fill="none"/>
      <circle id="arc" cx="118" cy="118" r="${R}" stroke="var(--orange)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${s ? C * (1 - left / total) : C}" style="transition:stroke-dashoffset 1s linear" data-c="${C}" data-total="${total}"/></svg>
      <div class="in">${s ? `<div class="clock tnum" id="clock">${fmt(left)}</div><div class="cap">${ic('moon')}${tr('sleep_left')}</div>` : `<div class="idle">${ic('moon')}<div class="cap">${bare('tab_sleep')}</div></div>`}</div></div>
    ${s && !s.mine ? `<p class="foot">${tr('sleep_set_by_other')}</p>` : ''}
    ${s && (p ? state.me.control : (s.mine || state.me.admin)) ? `<button class="btn glass cancel press" data-act="sleep" data-m="0">${tr('sleep_cancel')}</button>` : ''}
  </div>`;
  html += `<p class="foot">${p ? tr('sleep_player', { name: p.host ?? '' }) : canSet ? tr('sleep_personal') : tr('sleep_need_spotify')}</p>`;
  if (canSet) html += `<div class="presets">${state.sleepMinutes.map((m) => `<button class="preset glass press" data-act="sleep" data-m="${m}"><b class="tnum">${m}</b><small>${bare('min', { n: '' }) || 'min'}</small></button>`).join('')}</div>`;
  else if (p) html += `<p class="foot">${tr('control_hint')}</p>`;
  else html += `<button class="btn glass press" data-act="bot">${tr('open_bot')}</button>`;
  return html + `<p class="foot" style="color:var(--label3)">${tr('sleep_late')}</p>`;
}

const fmt = (sec) => { const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); const s = sec % 60; return `${h ? `${h}:` : ''}${String(m).padStart(h ? 2 : 1, '0')}:${String(s).padStart(2, '0')}`; };

const KIND_LOOK = { added: ['var(--green)', 'note'], queued: ['var(--orange)', 'bolt'], repost: ['var(--indigo)', 'repeat'] };
function settingsView() {
  let html = heading(tr('settings')) + `<p class="foot" style="margin-top:-4px">${tr('react_hint')}</p>`;
  if (!reactions || reactions === 'loading') return html + skeleton(3);
  const r = reactions;
  const topicScope = reactScope === 'topic' && r.topic;
  const raw = topicScope ? r.topic : r.chat;
  const fallback = (k) => (topicScope ? (r.chat[k] ?? r.defaults[k]) : r.defaults[k]);
  const current = (k) => raw[k] ?? fallback(k);
  const wholeLabel = state.chat.type === 'channel' ? tr('scope_channel') : state.chat.forum ? tr('scope_forum') : tr('scope_group');
  if (r.topic) html += `<div class="seg" style="--n:2;margin:4px 0 14px"><button aria-pressed="${!topicScope}" data-act="rxscope" data-s="chat">${wholeLabel}</button><button aria-pressed="${Boolean(topicScope)}" data-act="rxscope" data-s="topic">${tr('scope_topic')}</button></div>`;
  if (r.none) html += `<p class="foot err">${tr('none_allowed')}</p>`;
  else if (r.restricted) html += `<p class="foot">${tr('restricted')}</p>`;
  html += '<div class="list material fade">';
  for (const k of r.kinds) {
    const [color, icon] = KIND_LOOK[k];
    const val = current(k);
    const inherited = raw[k] == null;
    const open = openKind === k;
    html += `<button class="set" data-act="rxkind" data-k="${k}" aria-expanded="${open}"><span class="sq" style="background:${color}">${ic(icon)}</span>
      <span class="meta"><span class="t" style="display:block">${tr(`k_${k}`)}</span><span class="s" style="display:block">${tr(`k_${k}_hint`)}</span></span>
      <span class="val">${val ? `<span class="em${inherited ? ' dim' : ''}">${esc(val)}</span>` : `<span>${tr('off')}</span>`}${ic('chevR')}</span></button>`;
    if (open) {
      const emojis = showMore ? [...r.suggested, ...r.more] : r.suggested;
      html += `<div class="picker"><div class="choices">
          ${topicScope ? `<button class="choice press" data-act="rxset" data-k="${k}" data-e="~" aria-pressed="${inherited}">${wholeLabel} · ${fallback(k) ? esc(fallback(k)) : tr('off')}</button>` : ''}
          <button class="choice press" data-act="rxset" data-k="${k}" data-e="" aria-pressed="${!inherited && raw[k] === ''}">${tr('off')}</button></div>
        <div class="emojis">${emojis.map((e) => `<button class="emo" data-act="rxset" data-k="${k}" data-e="${esc(e)}" aria-pressed="${!inherited && raw[k] === e}">${esc(e)}</button>`).join('')}</div>
        ${r.more.length ? `<button class="morebtn" data-act="rxmore">${showMore ? tr('less') : tr('more')}</button>` : ''}</div>`;
    }
  }
  html += '</div>';
  if (r.syncs.length) {
    html += heading(tr('syncs_title')) + `<div class="list material">${r.syncs.map((x) => `<button class="toggle" role="switch" aria-checked="${x.reaction}" data-act="rxsync" data-id="${x.id}" style="position:relative"><span class="dot" style="background:${SVC_COLOR[x.provider]}"></span><span>${esc(x.name ?? '—')}</span><span class="switch"></span></button>`).join('')}</div>`;
    html += `<p class="foot">${tr('syncs_react_hint')}</p>`;
  }
  return html;
}

async function openSettings() {
  tab = 'settings'; reactions = 'loading'; openKind = null; showMore = false;
  reactScope = parseInt(chatParam.split('t')[1] || '0', 10) ? 'topic' : 'chat';
  render(); window.scrollTo({ top: 0 });
  try { reactions = await call('reactions'); } catch (e) { toast(errText(e), 'error'); tab = 'queue'; }
  render();
}

async function saveReactions(btn, op, input) {
  if (btn) btn.disabled = true;
  try { reactions = await call(op, input); toast(tr('saved')); render(); } catch (e) { toast(errText(e), 'error'); } finally { if (btn) btn.disabled = false; }
}

const TABS = [['queue', 'queue'], ['playlists', 'library'], ['picks', 'sparkles'], ['sleep', 'moon']];
function renderTabbar() {
  tabbar.hidden = false;
  tabbar.innerHTML = `<span class="lens" id="lens"></span>${TABS.map(([x, icon]) => `<button role="tab" data-tab="${x}" aria-selected="${x === tab}">${ic(icon)}<span>${bare(`tab_${x}`)}</span>${x === 'queue' && state.queue.length ? `<span class="badge tnum">${state.queue.length}</span>` : ''}${x === 'sleep' && state.sleep ? '<span class="badge pip"></span>' : ''}</button>`).join('')}`;
  moveLens(false);
}
function moveLens(animate = true) {
  const lens = document.getElementById('lens');
  const b = tabbar.querySelector('[aria-selected="true"]');
  if (!lens || !b) return;
  if (!animate) lens.style.transition = 'none';
  lens.style.left = `${b.offsetLeft}px`; lens.style.width = `${b.offsetWidth}px`;
  if (!animate) { void lens.offsetWidth; lens.style.transition = ''; }
}
addEventListener('resize', () => moveLens(false));

function render() {
  if (!state) return;
  songs.clear();
  const focused = document.activeElement?.id === 'q';
  const qv = document.getElementById('q')?.value ?? '';
  const view = { queue: queueView, playlists: playlistsView, picks: picksView, sleep: sleepView, settings: settingsView }[tab]();
  const chips = [
    ...state.playlists.slice(0, 2).map((p) => `<span class="chip glass"><span class="dot" style="background:${SVC_COLOR[p.provider]}"></span><b>${esc(p.name ?? '')}</b></span>`),
    state.sleep ? `<span class="chip glass">${ic('moon')}<b class="tnum" id="chipClock">${fmt(Math.max(0, Math.round(state.sleep.at - serverNow())))}</b></span>` : '',
  ].join('');
  const corner = tab === 'settings' ? `<button class="done glass press" data-act="settingsdone">${tr('done')}</button>`
    : state.me.admin ? `<button class="gear glass press" data-act="settings" aria-label="${tr('settings')}">${ic('gear')}</button>` : '';
  app.innerHTML = `<header>${corner}<div class="sub"><span class="live"></span><bdi dir="ltr">@${esc(state.bot)}</bdi></div>
      <h1 style="padding-inline-end:48px">${esc(state.chat.title ?? '')}${state.chat.topic ? `<span class="topic"># ${esc(state.chat.topic)}</span>` : ''}</h1>
      ${chips ? `<div class="chips">${chips}</div>` : ''}</header>
    ${tab === 'queue' ? nowPlaying() : ''}
    <section>${view}</section>`;
  renderTabbar();
  const q = document.getElementById('q');
  if (q) { q.value = qv; if (focused) { q.focus(); q.setSelectionRange(qv.length, qv.length); } }
  markPlaying();
  armSleepClock();
}

// --- events ------------------------------------------------------------------------
let searchTimer;
app.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  if (v.length < 2) { if (results) { results = null; render(); } return; }
  searchTimer = setTimeout(() => search(v), 450);
});
app.addEventListener('submit', (e) => { e.preventDefault(); const v = document.getElementById('q').value.trim(); if (v.length >= 2) search(v); document.getElementById('q').blur(); });
async function search(v) {
  results = 'loading'; render();
  try { const r = await call('search', { q: v }); if (document.getElementById('q')?.value.trim() === v) { results = r.results; render(); } } catch (e) { results = null; toast(errText(e), 'error'); render(); }
}

tabbar.addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (!b || b.dataset.tab === tab) return;
  tabbar.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  moveLens(true);
  tab = b.dataset.tab;
  try { localStorage.setItem('chat_tab', tab); } catch {}
  try { tg.HapticFeedback.selectionChanged(); } catch {}
  setTimeout(() => { render(); window.scrollTo({ top: 0 }); if (tab === 'picks' && !picks) loadPicks(false); }, 120);
});

app.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const song = b.dataset.song && songs.get(b.dataset.song);
  if (a === 'preview' && song) return previewing?.preview === song.preview ? setPreview(null) : setPreview(song);
  if (a === 'add' && song) return act(b, 'queueAdd', { song }, { ok: tr('added') });
  if (a === 'rm') return act(b, 'queueRemove', { id: Number(b.dataset.id) });
  if (a === 'up' || a === 'down') return act(b, 'queueMove', { id: Number(b.dataset.id), dir: a === 'up' ? -1 : 1 });
  if (a === 'clear') return confirmThen(tr('clear_confirm'), () => act(b, 'queueClear'));
  if (a === 'play' || a === 'playall') {
    return act(b, 'play', { all: a === 'playall' }, {
      ok: (r) => (r.result.to === 'chat' ? tr('posted_chat') : [r.result.played ? tr('sent_spotify', { n: r.result.played }) : '', r.result.missed ? tr('missed', { n: r.result.missed }) : ''].filter(Boolean).join(' · ')),
    });
  }
  if (a === 'ctl') { try { tg.HapticFeedback.impactOccurred('light'); } catch {} return act(b, 'control', { action: b.dataset.a }); }
  if (a === 'openurl') return tg.openLink(b.dataset.url);
  if (a === 'bot') return tg.openTelegramLink(`https://t.me/${state?.bot ?? 'chthmusicbot'}?start=accounts`);
  if (a === 'tracks') {
    const id = Number(b.dataset.id);
    if (openTracks[id]) { delete openTracks[id]; return render(); }
    openTracks[id] = 'loading'; render();
    try { openTracks[id] = (await call('tracks', { linkId: id })).tracks; } catch (err) { delete openTracks[id]; toast(errText(err), 'error'); }
    return render();
  }
  if (a === 'repick') return loadPicks(true);
  if (a === 'settings') return openSettings();
  if (a === 'settingsdone') { tab = 'queue'; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'rxscope') { reactScope = b.dataset.s; openKind = null; try { tg.HapticFeedback.selectionChanged(); } catch {} return render(); }
  if (a === 'rxkind') { openKind = openKind === b.dataset.k ? null : b.dataset.k; showMore = false; return render(); }
  if (a === 'rxmore') { showMore = !showMore; return render(); }
  if (a === 'rxset') {
    const e = b.dataset.e;
    return saveReactions(b, 'setReaction', { scope: reactScope === 'topic' && reactions?.topic ? 'topic' : 'chat', kind: b.dataset.k, emoji: e === '~' ? null : e });
  }
  if (a === 'rxsync') return saveReactions(b, 'syncReaction', { linkId: Number(b.dataset.id), on: b.getAttribute('aria-checked') !== 'true' });
  if (a === 'sleep') {
    const m = Number(b.dataset.m);
    return act(b, 'sleep', { minutes: m }, { ok: m ? tr('sleep_set') : tr('sleep_stopped') });
  }
  if (a === 'linkstart') {
    linking = 'loading'; render();
    try {
      const r = await call('myPlaylists');
      linking = { accounts: r.accounts, provider: r.accounts[0]?.provider, playlistId: null, direction: 'both', postExisting: false };
    } catch (err) { linking = null; toast(errText(err), 'error'); }
    return render();
  }
  if (!linking || linking === 'loading') return;
  try { tg.HapticFeedback.selectionChanged(); } catch {}
  if (a === 'lkacct') { linking.provider = b.dataset.p; linking.playlistId = null; return render(); }
  if (a === 'lkpl') { linking.playlistId = b.dataset.id || null; return render(); }
  if (a === 'lkdir') { linking.direction = b.dataset.d; return render(); }
  if (a === 'lkpost') { linking.postExisting = !linking.postExisting; return render(); }
  if (a === 'linkcancel') { linking = null; return render(); }
  if (a === 'link') {
    const acct = linking.accounts.find((x) => x.provider === linking.provider) ?? linking.accounts[0];
    const chosen = acct.playlists.find((p) => p.id === linking.playlistId);
    const dir = chosen && !chosen.editable ? 'out' : linking.direction;
    const input = { provider: acct.provider, direction: dir, postExisting: Boolean(linking.postExisting), ...(linking.playlistId ? { playlistId: linking.playlistId } : { create: true }) };
    const r = await act(b, 'addPlaylist', input, { ok: tr('linked') });
    if (r) { linking = null; picks = null; render(); }
  }
});

function confirmThen(text, fn) {
  if (tg?.showConfirm) tg.showConfirm(text, (yes) => yes && fn()); else if (confirm(text)) fn();
}

async function loadPicks(refreshing) {
  picks = 'loading'; render();
  try { picks = await call('picks', { refresh: refreshing }); } catch (e) { picks = { error: errText(e), items: [] }; }
  render();
}

// --- clocks -----------------------------------------------------------------------------
let clockTimer = null;
let fireTimer = null;
function armSleepClock() {
  clearInterval(clockTimer); clearTimeout(fireTimer);
  if (!state?.sleep) return;
  const tickClock = () => {
    const left = Math.max(0, Math.round(state.sleep.at - serverNow()));
    for (const id of ['clock', 'chipClock']) { const el = document.getElementById(id); if (el) el.textContent = fmt(left); }
    const arc = document.getElementById('arc');
    if (arc) arc.setAttribute('stroke-dashoffset', String(Number(arc.dataset.c) * (1 - left / Number(arc.dataset.total))));
  };
  clockTimer = setInterval(tickClock, 1000);
  // The server has no cron: when the time comes, this page asks it to fire the timer.
  const ms = Math.max(0, (state.sleep.at - serverNow()) * 1000) + 1500;
  if (ms < 2 ** 31) fireTimer = setTimeout(() => refresh(), ms);
}

async function refresh() {
  try {
    const res = await call('tick');
    clockSkew = res.now - Date.now() / 1000;
    state = res;
    if (document.activeElement?.tagName !== 'INPUT') render();
  } catch (e) {
    console.warn(e);
  }
}
setInterval(() => { if (document.visibilityState === 'visible' && chatParam) refresh(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chatParam) refresh(); });

// --- start ----------------------------------------------------------------------------
async function openChat(param) {
  chatParam = param;
  app.innerHTML = `<header><div class="sk" style="height:14px;width:110px"></div><div class="sk" style="height:34px;width:65%;margin-top:10px"></div></header><section style="margin-top:20px">${skeleton(4)}</section>`;
  try {
    state = await call('state');
    clockSkew = state.now - Date.now() / 1000;
    setAura(state.chat.title);
    if (!TABS.some(([x]) => x === tab)) tab = 'queue'; // ⚙︎ isn't remembered
    render();
    if (tab === 'picks') loadPicks(false);
  } catch (e) {
    app.innerHTML = `<section style="padding-top:60px">${emptyState('warn', `<p class="err">${esc(errText(e))}</p>`)}</section>`;
  }
}

async function home() {
  setAura('home');
  try {
    const r = await new Promise((resolve, reject) => tg.Serverless.call('chatApp', { op: 'home' }, (err, res) => (err ? reject(err) : resolve(res))));
    const head = `<header><div class="sub"><span class="live"></span><bdi dir="ltr">@${esc(r.bot)}</bdi></div><h1>${bare('home_title')}</h1></header>`;
    if (!r.chats.length) { app.innerHTML = `${head}<section>${emptyState('note', `<p>${tr('home_empty')}</p>`)}</section>`; return; }
    app.innerHTML = `${head}<section><p class="foot">${tr('home_hint')}</p><div class="list material">${r.chats.map((c) => `<button class="homecard" data-chat="${esc(c.param)}"><span class="art" style="--cv:${gradOf(c.title)}">${initial(c.title)}</span><span class="meta"><span class="t" style="display:block">${esc(c.title)}</span></span>${ic('chevR', 'i" style="width:14px;height:14px;color:var(--label3)')}</button>`).join('')}</div></section>`;
    app.querySelectorAll('[data-chat]').forEach((b) => { b.onclick = () => openChat(b.dataset.chat); });
  } catch (e) {
    app.innerHTML = `<section style="padding-top:60px">${emptyState('warn', `<p class="err">${esc(errText(e))}</p>`)}</section>`;
  }
}

(() => {
  if (!tg?.initData) { setAura('x'); app.innerHTML = `<section style="padding-top:80px">${emptyState('note', `<p>${tr('open_from_bot')}</p>`)}</section>`; return; }
  const param = tg.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('chat');
  if (param && /^c\d+(t\d+)?$/.test(param)) openChat(param); else home();
})();
</script>
</body>
</html>
