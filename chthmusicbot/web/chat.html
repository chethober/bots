<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat music</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8f); --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc); --btn-text: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5); --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --head: var(--tg-theme-header-bg-color, var(--bg)); --danger: var(--tg-theme-destructive-text-color, #e5484d);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--link); }
  [hidden] { display: none !important; }
  header { padding: 16px 16px 8px; }
  h1 { font-size: 20px; margin: 0; line-height: 1.25; overflow-wrap: anywhere; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); font-weight: 600; margin: 18px 16px 6px; }
  .sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .hint { color: var(--hint); font-size: 13px; margin: 8px 16px; }
  .err { color: var(--danger); }
  main { padding: 0 0 8px; }
  .card { background: var(--card); border-radius: 14px; margin: 8px 12px; padding: 12px; }
  .tabs { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--sep); }
  .tabs button { padding: 8px 2px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--text); }
  .primary { display: block; width: calc(100% - 24px); margin: 10px 12px; padding: 13px; border-radius: 12px; background: var(--btn); color: var(--btn-text); font-weight: 600; text-align: center; }
  .secondary { display: block; width: calc(100% - 24px); margin: 6px 12px; padding: 11px; border-radius: 12px; background: var(--card); color: var(--link); font-weight: 600; text-align: center; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 12px; }
  .row2 .primary, .row2 .secondary { width: 100%; margin: 0; }
  .list { margin: 0 12px; border-radius: 14px; background: var(--card); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 56px; }
  .item + .item { border-top: 1px solid var(--sep); }
  .art { width: 44px; height: 44px; border-radius: 8px; flex: none; background: var(--sep) center/cover no-repeat; display: grid; place-items: center; font-size: 20px; position: relative; overflow: hidden; }
  .art:disabled { opacity: 1; }
  .art.play::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35); color: #fff; font-size: 16px; }
  .art.playing::after { content: "❚❚"; font-size: 13px; }
  .meta { flex: 1; min-width: 0; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist, .note { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { display: flex; gap: 2px; flex: none; }
  .icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; color: var(--link); }
  .icon:active { background: var(--sep); }
  .icon.danger { color: var(--danger); }
  .search { display: flex; gap: 8px; margin: 10px 12px; }
  input[type=search], select, input[type=text] { width: 100%; padding: 11px 12px; font: inherit; border-radius: 12px; border: 1px solid var(--sep); background: var(--card); color: var(--text); outline: none; }
  select { appearance: auto; }
  .player { display: flex; gap: 12px; align-items: center; }
  .player .controls { display: flex; gap: 4px; direction: ltr; }
  .player .controls button { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); font-size: 18px; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--hint); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin: 10px 12px; }
  .grid button { padding: 14px 4px; border-radius: 12px; background: var(--card); font-weight: 600; }
  .grid button:active { background: var(--sep); }
  .clock { font-size: 48px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0 0; }
  .center { text-align: center; }
  .empty { padding: 22px 16px; text-align: center; color: var(--hint); }
  .choice { display: flex; align-items: center; gap: 10px; padding: 10px; }
  .choice + .choice { border-top: 1px solid var(--sep); }
  .choice input { width: 18px; height: 18px; flex: none; accent-color: var(--btn); }
  label.check { display: flex; gap: 10px; align-items: center; margin: 10px 16px; }
  label.check input { width: 18px; height: 18px; accent-color: var(--btn); }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(20,20,20,.92); color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; text-align: center; }
  .preview { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--head); border-top: 1px solid var(--sep); }
  .preview .bar { height: 3px; background: var(--sep); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .preview .bar i { display: block; height: 100%; width: 0; background: var(--btn); }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--sep); border-top-color: var(--btn); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: middle; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"><div class="empty"><span class="spin"></span></div></div>
<div class="preview" id="preview" hidden>
  <div class="art" id="pvArt"></div>
  <div class="meta"><div class="title" id="pvTitle"></div><div class="bar"><i id="pvBar"></i></div></div>
  <div class="acts"><button class="icon" id="pvAdd" title="+">＋</button><button class="icon" id="pvStop">■</button></div>
</div>
<div class="toast" id="toast" hidden></div>

const lang = (tg?.initDataUnsafe?.user?.language_code || navigator.language || 'en').slice(0, 2).toLowerCase();
const S = L[lang] || L.en;
if (lang === 'fa' || lang === 'ar') document.documentElement.dir = 'rtl';
document.documentElement.lang = L[lang] ? lang : 'en';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const tr = (k, v = {}) => String(S[k] ?? L.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => esc(v[x] ?? ''));

// --- calls -------------------------------------------------------------------------
function call(op, input = {}) {
  return new Promise((resolve, reject) => tg.Serverless.call('chatApp', { op, chat: chatParam, ...input }, (err, res) => (err ? reject(err) : resolve(res))));
}
const errText = (e) => (e?.parameters?.code && (S[`err_${e.parameters.code}`] || L.en[`err_${e.parameters.code}`])) || e?.message || String(e);

let toastTimer;
function toast(text, haptic = 'success') {
  const el = document.getElementById('toast');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  try { if (haptic === 'error') tg.HapticFeedback.notificationOccurred('error'); else tg.HapticFeedback.notificationOccurred(haptic); } catch {}
}

/** Run a call from a button: disabled meanwhile, errors toasted, state replaced. */
async function act(btn, op, input, { ok } = {}) {
  if (btn) btn.disabled = true;
  try {
    const res = await call(op, input);
    if (res?.chat) state = res;
    if (ok) toast(typeof ok === 'function' ? ok(res) : ok);
    render();
    return res;
  } catch (e) {
    toast(errText(e), 'error');
    if (e?.parameters?.code === 'NOT_FOUND') refresh();
    return null;
  } finally {
    if (btn) btn.disabled = false;
  }
}

// --- state ------------------------------------------------------------------------
const app = document.getElementById('app');
let chatParam = null;
let state = null;
let tab = 'queue';
let clockSkew = 0;           // server seconds - local seconds
let results = null;          // search results
let picks = null;            // { items, seeds } | 'loading'
let openTracks = {};         // linkId → tracks | 'loading'
let linking = null;          // the "link a playlist" form, or null
try { tab = localStorage.getItem('chat_tab') || 'queue'; } catch {}

const serverNow = () => Date.now() / 1000 + clockSkew;
const svc = (p) => state?.services?.[p] ?? { name: p, icon: '🎵' };

// --- preview (30 s clips from iTunes / Deezer, played here) -------------------------
const audio = new Audio();
let previewing = null;
function setPreview(song) {
  const bar = document.getElementById('preview');
  if (!song) { audio.pause(); previewing = null; bar.hidden = true; markPlaying(); return; }
  previewing = song;
  audio.src = song.preview; audio.play().catch(() => toast('▶︎ ✕', 'error'));
  document.getElementById('pvTitle').textContent = [song.title, song.artist].filter(Boolean).join(' — ');
  document.getElementById('pvArt').style.backgroundImage = song.artwork ? `url("${cssUrl(song.artwork)}")` : '';
  bar.hidden = false;
  markPlaying();
}
audio.addEventListener('timeupdate', () => { document.getElementById('pvBar').style.width = `${(audio.currentTime / (audio.duration || 30)) * 100}%`; });
audio.addEventListener('ended', () => setPreview(null));
document.getElementById('pvStop').onclick = () => setPreview(null);
document.getElementById('pvAdd').onclick = (e) => previewing && act(e.currentTarget, 'queueAdd', { song: previewing }, { ok: tr('added') });
function markPlaying() {
  document.querySelectorAll('[data-preview]').forEach((el) => el.classList.toggle('playing', Boolean(previewing) && el.dataset.preview === previewing.preview));
}

// --- views ------------------------------------------------------------------------
const songs = new Map(); // data-song keys → song objects, rebuilt per render
let songSeq = 0;
function keep(song) { const k = `s${++songSeq}`; songs.set(k, song); return k; }

// A URL for CSS url("…"): quotes, brackets, backslashes and spaces percent-encoded.
const cssUrl = (u) => String(u).replace(/["'()\\\s]/g, (c) => encodeURIComponent(c));

function songRow(song, { note = '', actions = '' } = {}) {
  const k = keep(song);
  const attrs = [
    `class="art${song.preview ? ' play' : ''}"`,
    song.artwork ? `style="background-image:url(&quot;${esc(cssUrl(song.artwork))}&quot;)"` : '',
    song.preview ? `data-act="preview" data-song="${k}" data-preview="${esc(song.preview)}"` : 'disabled',
  ].filter(Boolean).join(' ');
  return `<div class="item"><button ${attrs}>${song.artwork ? '' : '🎵'}</button>
    <div class="meta"><div class="title">${esc(song.title)}</div><div class="artist">${esc(song.artist ?? '')}${note ? ` · ${note}` : ''}</div></div>
    <div class="acts">${actions.replace(/\{k\}/g, k)}</div></div>`;
}
const addBtn = '<button class="icon" data-act="add" data-song="{k}" aria-label="+">＋</button>';

function playerCard() {
  const p = state.player;
  if (!p) return '';
  const ctl = state.me.control;
  const now = p.track
    ? `<div class="title">${p.playing ? '▶️' : '⏸'} ${esc(p.track.title)}</div><div class="artist">${esc(p.track.artist ?? '')}</div>`
    : `<div class="artist">${p.error ? `<span class="err">${esc(p.error)}</span>` : tr('nothing_playing')}</div>`;
  return `<div class="card"><div class="player"><div class="meta">
      <div class="note">🟢 ${tr('host', { name: p.host ?? '' })}${p.device ? ` · ${tr('on_device', { device: p.device })}` : ''}</div>${now}</div>
      ${ctl ? `<div class="controls"><button data-act="ctl" data-a="prev">⏮</button><button data-act="ctl" data-a="play">⏯</button><button data-act="ctl" data-a="next">⏭</button></div>` : ''}
    </div>
    ${p.next?.length ? `<div class="note" style="margin-top:8px">${tr('up_next')}: ${p.next.slice(0, 3).map((x) => esc(x.label)).join(' · ')}</div>` : ''}</div>`;
}

function queueView() {
  const ctl = state.me.control;
  const q = state.queue;
  let html = `<form class="search" id="searchForm"><input type="search" id="q" placeholder="${tr('search_ph')}" autocomplete="off" enterkeyhint="search"></form>`;
  if (results) {
    html += `<h2>${tr('results')}</h2>`;
    html += results === 'loading' ? '<div class="empty"><span class="spin"></span></div>'
      : results.length ? `<div class="list">${results.map((s) => songRow(s, { actions: addBtn })).join('')}</div>` : `<div class="empty">${tr('no_results')}</div>`;
  }
  html += `<h2>${tr('queue')}${q.length ? ` · ${q.length}` : ''}</h2>`;
  if (!q.length) html += `<div class="empty">${tr('queue_empty')}</div>`;
  else {
    html += `<div class="list">${q.map((s, i) => songRow(s, {
      note: tr('by', { name: s.by ?? '—' }),
      actions: `${ctl && i > 0 ? `<button class="icon" data-act="up" data-id="${s.id}" aria-label="up">↑</button>` : ''}${ctl && i < q.length - 1 ? `<button class="icon" data-act="down" data-id="${s.id}" aria-label="down">↓</button>` : ''}${ctl || s.mine ? `<button class="icon danger" data-act="rm" data-id="${s.id}" aria-label="remove">✕</button>` : ''}`,
    })).join('')}</div>`;
  }
  if (ctl && q.length) {
    html += state.player
      ? `<div class="row2"><button class="primary" data-act="play">${tr('play_next')}</button><button class="secondary" data-act="playall">${tr('all_spotify')}</button></div>`
      : `<button class="primary" data-act="play">${tr('play_next')}</button>`;
    html += `<p class="hint">${state.player ? tr('queue_where_player', { name: state.player.host ?? '' }) : tr('queue_where_chat')}</p>`;
    html += `<button class="secondary" style="color:var(--danger)" data-act="clear">${tr('clear')}</button>`;
  } else if (q.length) html += `<p class="hint">${tr('control_hint')}</p>`;
  return html;
}

const DIRS = { both: '⇄', in: '💬→🎧', out: '🎧→💬' };
function playlistsView() {
  let html = '';
  if (!state.playlists.length) html += `<div class="empty">${tr('pl_empty')}</div>`;
  for (const pl of state.playlists) {
    const s = svc(pl.provider);
    const tracks = openTracks[pl.id];
    html += `<div class="card"><div class="player"><div class="meta"><div class="title">${s.icon} ${esc(pl.name ?? '—')}</div>
      <div class="note">${s.name} · ${tr('tracks', { n: pl.tracks })} · ${DIRS[pl.direction] ?? ''}</div></div>
      <div class="acts">${pl.url ? `<button class="icon" data-act="openurl" data-url="${esc(pl.url)}" aria-label="${tr('open')}">↗</button>` : ''}
      <button class="icon" data-act="tracks" data-id="${pl.id}">${tracks ? '▴' : '▾'}</button></div></div></div>`;
    if (tracks === 'loading') html += '<div class="empty"><span class="spin"></span></div>';
    else if (Array.isArray(tracks)) html += `<div class="list">${tracks.slice(0, 100).map((x) => songRow(x, { actions: addBtn })).join('') || `<div class="empty">—</div>`}</div>`;
  }
  html += `<p class="hint">${tr('sync_hint')}</p>`;
  if (!state.me.admin) return html + `<p class="hint">${tr('admins_link')}</p>`;
  if (!state.me.accounts.length) {
    return html + `<p class="hint">${tr('connect_first')}</p><button class="secondary" data-act="bot">${tr('open_bot')}</button>`;
  }
  if (!linking) return html + `<button class="primary" data-act="linkstart">${tr('link_pl')}</button>`;
  return html + linkForm();
}

function linkForm() {
  if (linking === 'loading') return '<div class="empty"><span class="spin"></span></div>';
  const accts = linking.accounts;
  const acct = accts.find((a) => a.provider === linking.provider) ?? accts[0];
  const chosen = acct.playlists.find((p) => p.id === linking.playlistId);
  const readOnly = chosen && !chosen.editable;
  const dirs = readOnly ? ['out'] : ['both', 'in', 'out'];
  const dir = dirs.includes(linking.direction) ? linking.direction : dirs[0];
  const name = state.chat.topic || state.chat.title || '';
  return `<h2>${tr('pick_account')}</h2><div style="margin:0 12px"><select id="lkAcct">${accts.map((a) => `<option value="${a.provider}"${a.provider === acct.provider ? ' selected' : ''}>${svc(a.provider).icon} ${esc(svc(a.provider).name)} · ${esc(a.account ?? '')}</option>`).join('')}</select></div>
    ${acct.error ? `<p class="hint err">${esc(acct.error)}</p>` : ''}
    <h2>${tr('pick_playlist')}</h2><div class="list" style="max-height:300px;overflow:auto">
      <label class="choice"><input type="radio" name="lkPl" value="" ${!linking.playlistId ? 'checked' : ''}><span class="meta"><span class="title">${tr('new_named', { name })}</span></span></label>
      ${acct.playlists.map((p) => `<label class="choice"><input type="radio" name="lkPl" value="${esc(p.id)}" ${p.id === linking.playlistId ? 'checked' : ''}><span class="meta"><span class="title">${esc(p.name)}</span><span class="note">${p.total != null ? tr('tracks', { n: p.total }) : ''}${p.editable ? '' : ` · 👁 ${tr('read_only')}`}</span></span></label>`).join('')}
    </div>
    <h2>${tr('direction')}</h2><div class="list">${dirs.map((d) => `<label class="choice"><input type="radio" name="lkDir" value="${d}" ${d === dir ? 'checked' : ''}><span>${tr(`dir_${d}`)}</span></label>`).join('')}</div>
    ${dir !== 'in' && linking.playlistId ? `<label class="check"><input type="checkbox" id="lkPost" ${linking.postExisting ? 'checked' : ''}><span>${tr('post_existing')}</span></label>` : ''}
    <button class="primary" data-act="link">${tr('link')}</button><button class="secondary" data-act="linkcancel">${tr('cancel')}</button>`;
}

function picksView() {
  let html = `<p class="hint">${tr('picks_hint')}</p>`;
  if (!picks || picks === 'loading') return html + `<div class="empty"><span class="spin"></span><br><br>${tr('picks_wait')}</div>`;
  if (picks.error) return html + `<div class="empty err">${esc(picks.error)}</div><button class="secondary" data-act="repick">${tr('refresh')}</button>`;
  if (!picks.items.length) return html + `<div class="empty">${tr('picks_empty')}</div><button class="secondary" data-act="repick">${tr('refresh')}</button>`;
  if (picks.items.every((x) => x.reason === 'trending')) html += `<p class="hint">${tr('picks_cold')}</p>`;
  const reason = (x) => (x.reason === 'similar' ? tr('because', { name: x.because }) : x.reason === 'more' ? tr('more_from', { name: x.because }) : `🔥 ${tr('trending')}`);
  html += `<div class="list">${picks.items.map((x) => songRow(x, { note: reason(x), actions: addBtn })).join('')}</div>`;
  return html + `<button class="secondary" data-act="repick">${tr('refresh')}</button>`;
}

function sleepView() {
  const s = state.sleep;
  const p = state.player;
  const canSet = p ? state.me.control : state.me.spotify;
  let html = '';
  if (s) {
    const left = Math.max(0, Math.round(s.at - serverNow()));
    const allowed = p ? state.me.control : (s.mine || state.me.admin);
    html += `<div class="card center"><div class="note">${tr('sleep_left')}</div><div class="clock" id="clock">${fmt(left)}</div>
      ${s.mine ? '' : `<div class="note">${tr('sleep_set_by_other')}</div>`}</div>`;
    if (allowed) html += `<button class="secondary" style="color:var(--danger)" data-act="sleep" data-m="0">${tr('sleep_cancel')}</button>`;
  }
  html += `<p class="hint">${p ? tr('sleep_player', { name: p.host ?? '' }) : canSet ? tr('sleep_personal') : tr('sleep_need_spotify')}</p>`;
  if (canSet) html += `<div class="grid">${state.sleepMinutes.map((m) => `<button data-act="sleep" data-m="${m}">${tr('min', { n: m })}</button>`).join('')}</div>`;
  else if (p) html += `<p class="hint">${tr('control_hint')}</p>`;
  else html += `<button class="secondary" data-act="bot">${tr('open_bot')}</button>`;
  return html + `<p class="hint">${tr('sleep_late')}</p>`;
}

const fmt = (sec) => { const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); const s = sec % 60; return `${h ? `${h}:` : ''}${String(m).padStart(h ? 2 : 1, '0')}:${String(s).padStart(2, '0')}`; };

const TABS = ['queue', 'playlists', 'picks', 'sleep'];
function render() {
  if (!state) return;
  songs.clear();
  const focused = document.activeElement?.id === 'q';
  const qv = document.getElementById('q')?.value ?? '';
  const title = [state.chat.title, state.chat.topic].filter(Boolean).join(' › ');
  const view = { queue: queueView, playlists: playlistsView, picks: picksView, sleep: sleepView }[tab]();
  app.innerHTML = `<header><h1>${esc(title)}</h1><div class="sub">${state.playlists.length ? state.playlists.map((p) => `${svc(p.provider).icon} ${esc(p.name ?? '')}`).slice(0, 3).join(' · ') : '🎛'}${state.sleep ? ` · 😴 ${fmt(Math.max(0, Math.round(state.sleep.at - serverNow())))}` : ''}</div></header>
    ${playerCard()}
    <nav class="tabs" role="tablist">${TABS.map((x) => `<button role="tab" data-tab="${x}" aria-selected="${x === tab}">${tr(`tab_${x}`)}</button>`).join('')}</nav>
    <main>${view}</main>`;
  const q = document.getElementById('q');
  if (q) { q.value = qv; if (focused) { q.focus(); q.setSelectionRange(qv.length, qv.length); } }
  markPlaying();
  armSleepClock();
}

// --- events ------------------------------------------------------------------------
let searchTimer;
app.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  if (v.length < 2) { if (results) { results = null; render(); } return; }
  searchTimer = setTimeout(() => search(v), 450);
});
app.addEventListener('submit', (e) => { e.preventDefault(); const v = document.getElementById('q').value.trim(); if (v.length >= 2) search(v); document.getElementById('q').blur(); });
async function search(v) {
  results = 'loading'; render();
  try { const r = await call('search', { q: v }); if (document.getElementById('q')?.value.trim() === v) { results = r.results; render(); } } catch (e) { results = null; toast(errText(e), 'error'); render(); }
}

app.addEventListener('change', (e) => {
  if (!linking || linking === 'loading') return;
  if (e.target.id === 'lkAcct') { linking.provider = e.target.value; linking.playlistId = null; render(); }
  if (e.target.name === 'lkPl') { linking.playlistId = e.target.value || null; render(); }
  if (e.target.name === 'lkDir') { linking.direction = e.target.value; render(); }
  if (e.target.id === 'lkPost') linking.postExisting = e.target.checked;
});

app.addEventListener('click', async (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) {
    tab = tabBtn.dataset.tab;
    try { localStorage.setItem('chat_tab', tab); } catch {}
    try { tg.HapticFeedback.selectionChanged(); } catch {}
    render(); window.scrollTo(0, 0);
    if (tab === 'picks' && !picks) loadPicks(false);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const song = b.dataset.song && songs.get(b.dataset.song);
  if (a === 'preview' && song) return previewing?.preview === song.preview ? setPreview(null) : setPreview(song);
  if (a === 'add' && song) return act(b, 'queueAdd', { song }, { ok: tr('added') });
  if (a === 'rm') return act(b, 'queueRemove', { id: Number(b.dataset.id) });
  if (a === 'up' || a === 'down') return act(b, 'queueMove', { id: Number(b.dataset.id), dir: a === 'up' ? -1 : 1 });
  if (a === 'clear') return confirmThen(tr('clear_confirm'), () => act(b, 'queueClear'));
  if (a === 'play' || a === 'playall') {
    return act(b, 'play', { all: a === 'playall' }, {
      ok: (r) => (r.result.to === 'chat' ? tr('posted_chat') : [r.result.played ? tr('sent_spotify', { n: r.result.played }) : '', r.result.missed ? tr('missed', { n: r.result.missed }) : ''].filter(Boolean).join(' · ')),
    });
  }
  if (a === 'ctl') return act(b, 'control', { action: b.dataset.a });
  if (a === 'openurl') return tg.openLink(b.dataset.url);
  if (a === 'bot') return tg.openTelegramLink(`https://t.me/${state?.bot ?? 'chthmusicbot'}?start=accounts`);
  if (a === 'tracks') {
    const id = Number(b.dataset.id);
    if (openTracks[id]) { delete openTracks[id]; return render(); }
    openTracks[id] = 'loading'; render();
    try { openTracks[id] = (await call('tracks', { linkId: id })).tracks; } catch (err) { delete openTracks[id]; toast(errText(err), 'error'); }
    return render();
  }
  if (a === 'repick') return loadPicks(true);
  if (a === 'sleep') {
    const m = Number(b.dataset.m);
    return act(b, 'sleep', { minutes: m }, { ok: m ? tr('sleep_set') : tr('sleep_stopped') });
  }
  if (a === 'linkstart') {
    linking = 'loading'; render();
    try {
      const r = await call('myPlaylists');
      linking = { accounts: r.accounts, provider: r.accounts[0]?.provider, playlistId: null, direction: 'both', postExisting: false };
    } catch (err) { linking = null; toast(errText(err), 'error'); }
    return render();
  }
  if (a === 'linkcancel') { linking = null; return render(); }
  if (a === 'link') {
    const acct = linking.accounts.find((x) => x.provider === linking.provider) ?? linking.accounts[0];
    const chosen = acct.playlists.find((p) => p.id === linking.playlistId);
    const dir = chosen && !chosen.editable ? 'out' : linking.direction;
    const input = { provider: acct.provider, direction: dir, postExisting: Boolean(linking.postExisting), ...(linking.playlistId ? { playlistId: linking.playlistId } : { create: true }) };
    const r = await act(b, 'addPlaylist', input, { ok: tr('linked') });
    if (r) { linking = null; picks = null; render(); }
  }
});

function confirmThen(text, fn) {
  if (tg?.showConfirm) tg.showConfirm(text, (yes) => yes && fn()); else if (confirm(text)) fn();
}

async function loadPicks(refreshing) {
  picks = 'loading'; render();
  try { picks = await call('picks', { refresh: refreshing }); } catch (e) { picks = { error: errText(e), items: [] }; }
  render();
}

// --- clocks: the sleep countdown, its timer firing, and a gentle poll -----------------
let clockTimer = null;
let fireTimer = null;
function armSleepClock() {
  clearInterval(clockTimer); clearTimeout(fireTimer);
  if (!state?.sleep) return;
  clockTimer = setInterval(() => {
    const el = document.getElementById('clock');
    const left = Math.max(0, Math.round(state.sleep.at - serverNow()));
    if (el) el.textContent = fmt(left);
  }, 1000);
  // The server has no cron: when the time comes, this page asks it to fire the timer.
  const ms = Math.max(0, (state.sleep.at - serverNow()) * 1000) + 1500;
  if (ms < 2 ** 31) fireTimer = setTimeout(() => refresh(), ms);
}

async function refresh() {
  try {
    const res = await call('tick');
    clockSkew = res.now - Date.now() / 1000;
    state = res;
    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'SELECT') render();
  } catch (e) {
    console.warn(e);
  }
}
setInterval(() => { if (document.visibilityState === 'visible' && chatParam) refresh(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chatParam) refresh(); });

// --- start ----------------------------------------------------------------------------
async function openChat(param) {
  chatParam = param;
  app.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try {
    state = await call('state');
    clockSkew = state.now - Date.now() / 1000;
    if (TABS.indexOf(tab) < 0) tab = 'queue';
    render();
    if (tab === 'picks') loadPicks(false);
  } catch (e) {
    app.innerHTML = `<div class="empty err">${esc(errText(e))}</div>`;
  }
}

async function home() {
  try {
    const r = await new Promise((resolve, reject) => tg.Serverless.call('chatApp', { op: 'home' }, (err, res) => (err ? reject(err) : resolve(res))));
    if (!r.chats.length) { app.innerHTML = `<header><h1>${tr('home_title')}</h1></header><div class="empty">${tr('home_empty')}</div>`; return; }
    app.innerHTML = `<header><h1>${tr('home_title')}</h1></header><p class="hint">${tr('home_hint')}</p>
      <div class="list">${r.chats.map((c) => `<button class="item" style="width:100%;text-align:start" data-chat="${esc(c.param)}"><span class="art">${c.type === 'channel' ? '📢' : '👥'}</span><span class="meta"><span class="title">${esc(c.title)}</span></span><span class="icon">›</span></button>`).join('')}</div>`;
    app.querySelectorAll('[data-chat]').forEach((b) => { b.onclick = () => openChat(b.dataset.chat); });
  } catch (e) {
    app.innerHTML = `<div class="empty err">${esc(errText(e))}</div>`;
  }
}

(() => {
  if (!tg?.initData) { app.innerHTML = `<div class="empty">${tr('open_from_bot')}</div>`; return; }
  const param = tg.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('chat');
  if (param && /^c\d+(t\d+)?$/.test(param)) openChat(param); else home();
})();
</script>
</body>
</html>
