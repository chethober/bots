<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect your music</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888); --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc); --btn-text: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  p { margin: 8px 0; }
  .hint { color: var(--hint); font-size: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 14px 0; }
  .ok { font-weight: 600; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; background: var(--btn); color: var(--btn-text); cursor: pointer; margin-top: 10px; }
  button.secondary { background: transparent; color: var(--link); padding: 8px; }
  button:disabled { opacity: .6; }
  input { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); margin-top: 8px; font-family: ui-monospace, Menlo, monospace; }
  code { word-break: break-all; background: var(--bg); padding: 2px 5px; border-radius: 6px; font-size: 13px; }
  ol { padding-inline-start: 20px; margin: 8px 0; }
  li { margin: 6px 0; }
  a { color: var(--link); }
  .err { color: #d33; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"><p class="hint">…</p></main>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const L = {

  },

    connect: 'اتصال', own_app: 'استفاده از اپ اسپاتیفای خودم', bot_app: 'استفاده از اپ اسپاتیفای بات',
    own_why: 'اسپاتیفای به اپ‌های حالت توسعه فقط اجازه می‌ده چند کاربر مشخص رو راه بدن. اگه اپ بات راهت نداد، در دو دقیقه اپ خودت رو بساز:',
    own_steps: ['<a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a> رو باز کن و <b>Create app</b> رو بزن.', 'این <b>Redirect URI</b> رو اضافه کن:', 'تیک <b>Web API</b> رو بزن، ذخیره کن و <b>Client ID</b> اپ رو اینجا بذار:'],
    copy: 'کپی', copied: 'کپی شد ✓', client_id: 'Client ID (۳۲ حرف و عدد)',
    browser: 'ورود رو توی مرورگر تموم کن. آخرش یه پیام نشون می‌ده که باید برای بات بفرستی.',
    apple_hint: 'با Apple ID وارد شو. اپل موزیک اشتراک فعال لازم داره.',
    apple_browser: 'باز کردن توی مرورگر', unavailable: 'این سرویس هنوز روی این بات راه‌اندازی نشده.',
    send_bot: 'تقریباً تمومه: این پیام رو برای بات بفرست.', open_bot: 'باز کردن بات',
    open_from_bot: 'این صفحه رو از داخل بات باز کن.', done: '✅ وصل شد! می‌تونی این صفحه رو ببندی.',
  },
  ar: {
    spotify_title: '🟢 ربط Spotify', apple_title: '🍎 ربط Apple Music',
    connected_as: 'مرتبط باسم {name}.', reconnect: 'اربط مجددًا',
    connect: 'ربط', own_app: 'استخدم تطبيق Spotify الخاص بي', bot_app: 'استخدم تطبيق Spotify الخاص بالبوت',
    own_why: 'يسمح Spotify لتطبيقات وضع التطوير بخدمة عدد قليل من المستخدمين المعروفين فقط. إن لم يقبلك تطبيق البوت، أنشئ تطبيقك في دقيقتين:',
    own_steps: ['افتح <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a> واضغط <b>Create app</b>.', 'أضف عنوان <b>Redirect URI</b> هذا:', 'فعّل <b>Web API</b> واحفظ والصق <b>Client ID</b> هنا:'],
    copy: 'نسخ', copied: 'تم النسخ ✓', client_id: 'Client ID (32 حرفًا ورقمًا)',
    browser: 'أكمل تسجيل الدخول في المتصفح. في النهاية تظهر رسالة لترسلها إلى البوت.',
    apple_hint: 'سجّل الدخول بمعرف Apple. يتطلب Apple Music اشتراكًا فعّالًا.',
    apple_browser: 'افتح في المتصفح بدلًا من ذلك', unavailable: 'هذه الخدمة غير مُعدّة في هذا البوت بعد.',
    send_bot: 'اقتربت: أرسل هذه الرسالة إلى البوت.', open_bot: 'افتح البوت',
    open_from_bot: 'افتح هذه الصفحة من البوت.', done: '✅ تم الربط! يمكنك إغلاق هذه الصفحة.',
  },
  ru: {
    spotify_title: '🟢 Подключить Spotify', apple_title: '🍎 Подключить Apple Music',
    connected_as: 'Подключено: {name}.', reconnect: 'Подключить заново',
    connect: 'Подключить', own_app: 'Своё приложение Spotify', bot_app: 'Приложение Spotify бота',
    own_why: 'Spotify разрешает приложениям в режиме разработки обслуживать лишь несколько знакомых пользователей. Если приложение бота тебя не пускает, создай своё за две минуты:',
    own_steps: ['Открой <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a> и нажми <b>Create app</b>.', 'Добавь этот <b>Redirect URI</b>:', 'Отметь <b>Web API</b>, сохрани и вставь сюда <b>Client ID</b>:'],
    copy: 'Копировать', copied: 'Скопировано ✓', client_id: 'Client ID (32 буквы и цифры)',
    browser: 'Закончи вход в браузере. В конце появится сообщение, которое нужно отправить боту.',
    apple_hint: 'Войди со своим Apple ID. Для Apple Music нужна активная подписка.',
    apple_browser: 'Открыть в браузере', unavailable: 'Этот сервис ещё не настроен в боте.',
    send_bot: 'Почти готово: отправь это сообщение боту.', open_bot: 'Открыть бота',
    open_from_bot: 'Открой эту страницу из бота.', done: '✅ Подключено! Эту страницу можно закрыть.',
  },
  es: {
    spotify_title: '🟢 Conectar Spotify', apple_title: '🍎 Conectar Apple Music',
    connected_as: 'Conectado como {name}.', reconnect: 'Conectar de nuevo',
    connect: 'Conectar', own_app: 'Usar mi propia app de Spotify', bot_app: 'Usar la app de Spotify del bot',
    own_why: 'Spotify solo deja que una app en modo desarrollo atienda a unos pocos usuarios conocidos. Si la app del bot no te deja entrar, crea la tuya en dos minutos:',
    own_steps: ['Abre <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a> y toca <b>Create app</b>.', 'Añade esta <b>Redirect URI</b>:', 'Marca <b>Web API</b>, guarda y pega aquí el <b>Client ID</b> de la app:'],
    copy: 'Copiar', copied: 'Copiado ✓', client_id: 'Client ID (32 letras y dígitos)',
    browser: 'Termina de iniciar sesión en el navegador. Al final muestra un mensaje para enviar al bot.',
    apple_hint: 'Inicia sesión con tu Apple ID. Apple Music requiere una suscripción activa.',
    apple_browser: 'Abrir en el navegador', unavailable: 'Este servicio aún no está configurado en este bot.',
    send_bot: 'Casi listo: envía este mensaje al bot.', open_bot: 'Abrir el bot',
    open_from_bot: 'Abre esta página desde el bot.', done: '✅ ¡Conectado! Puedes cerrar esta página.',
  },
};
const lang = (tg?.initDataUnsafe?.user?.language_code || navigator.language || 'en').slice(0, 2).toLowerCase();
const S = L[lang] || L.en;
if (lang === 'fa' || lang === 'ar') document.documentElement.dir = 'rtl';
const tr = (k, v = {}) => String(S[k] ?? L.en[k]).replace(/\{(\w+)\}/g, (_, x) => esc(v[x] ?? ''));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const app = document.getElementById('app');
// The host 308s /callback.html to /callback and drops the query, so Spotify
// must redirect to the extensionless path.
const REDIRECT = `${location.origin}/callback`;
const BOT = 'chthmusicbot';

function call(name, input = {}) {
  return new Promise((resolve, reject) => tg.Serverless.call(name, input, (err, res) => (err ? reject(err) : resolve(res))));
}

function showError(e) {
  const box = document.getElementById('error');
  if (box) { box.hidden = false; box.textContent = e?.message || String(e); }
}

function copyButton(text) {
  const b = document.createElement('button');
  b.className = 'secondary';
  b.textContent = tr('copy');
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); } catch { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
    b.textContent = tr('copied');
  };
  return b;
}

// A message to paste into the bot, for logins that finished outside the Mini App.
function sendToBot(command) {
  app.innerHTML = `<h1>${tr('send_bot')}</h1><div class="card"><code id="cmd">${esc(command)}</code></div>`;
  document.querySelector('.card').append(copyButton(command));
  const a = document.createElement('a');
  a.href = `https://t.me/${BOT}?text=${encodeURIComponent(command)}`;
  a.innerHTML = `<button>${tr('open_bot')}</button>`;
  app.append(a);
}

const inIframe = () => { try { return window.self !== window.top; } catch { return true; } };

// --- Spotify (PKCE) ---------------------------------------------------------------
const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function spotifyConnect(clientId) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const { url } = await call('spotifyStart', { clientId, challenge, verifier, redirectUri: REDIRECT });
  // Telegram Web shows Mini Apps in an iframe, where Spotify's login can't load.
  if (inIframe()) {
    tg.openLink(url);
    app.innerHTML = `<h1>${tr('spotify_title')}</h1><p>${tr('browser')}</p>`;
  } else {
    location.href = url;
  }
}

async function spotifyView(state) {
  const s = state.services.spotify;
  if (!s.available) { app.innerHTML = `<h1>${tr('spotify_title')}</h1><p>${tr('unavailable')}</p>`; return; }
  const steps = S.own_steps || L.en.own_steps;
  app.innerHTML = `
    <h1>${tr('spotify_title')}</h1>
    ${s.connected ? `<p class="ok">${tr('connected_as', { name: s.name })}</p>` : ''}
    <div id="bot" ${state.spotifyDefaultApp ? '' : 'hidden'}>
      <button id="go">${s.connected ? tr('reconnect') : tr('connect')}</button>
      <button class="secondary" id="toggle">${tr('own_app')}</button>
    </div>
    <div id="own" class="card" ${state.spotifyDefaultApp ? 'hidden' : ''}>
      <p class="hint">${tr('own_why')}</p>
      <ol>
        <li>${steps[0]}</li>
        <li>${steps[1]}<br><code id="redirect">${esc(REDIRECT)}</code><span id="copyslot"></span></li>
        <li>${steps[2]}<input id="cid" placeholder="${tr('client_id')}" autocomplete="off" spellcheck="false"></li>
      </ol>
      <button id="go2">${tr('connect')}</button>
      ${state.spotifyDefaultApp ? `<button class="secondary" id="back">${tr('bot_app')}</button>` : ''}
    </div>
    <p id="error" class="err" hidden></p>`;
  document.getElementById('copyslot').append(copyButton(REDIRECT));
  try { document.getElementById('cid').value = localStorage.getItem('spotify_client_id') || ''; } catch {}
  const run = (btn, id) => async () => {
    btn.disabled = true;
    try { await spotifyConnect(id()); } catch (e) { showError(e); btn.disabled = false; }
  };
  const go = document.getElementById('go');
  go.onclick = run(go, () => null);
  const go2 = document.getElementById('go2');
  go2.onclick = run(go2, () => {
    const v = document.getElementById('cid').value.trim();
    try { localStorage.setItem('spotify_client_id', v); } catch {}
    return v;
  });
  document.getElementById('toggle').onclick = () => { document.getElementById('own').hidden = false; document.getElementById('bot').hidden = true; };
  const back = document.getElementById('back');
  if (back) back.onclick = () => { document.getElementById('own').hidden = true; document.getElementById('bot').hidden = false; };
}

// --- Apple Music (MusicKit JS) -------------------------------------------------------
function loadMusicKit() {
  if (window.MusicKit) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://js-cdn.music.apple.com/musickit/v3/musickit.js';
    s.onload = () => (window.MusicKit ? resolve() : document.addEventListener('musickitloaded', resolve, { once: true }));
    s.onerror = () => reject(new Error('MusicKit failed to load'));
    document.head.append(s);
  });
}

async function appleAuthorize(developerToken) {
  await loadMusicKit();
  await MusicKit.configure({ developerToken, app: { name: 'chthmusicbot', build: '1.0.0' } });
  return MusicKit.getInstance().authorize();
}

async function appleView(state) {
  const s = state.services.apple;
  if (!s.available) { app.innerHTML = `<h1>${tr('apple_title')}</h1><p>${tr('unavailable')}</p>`; return; }
  app.innerHTML = `
    <h1>${tr('apple_title')}</h1>
    ${s.connected ? `<p class="ok">${tr('connected_as', { name: s.name })}</p>` : ''}
    <p class="hint">${tr('apple_hint')}</p>
    <button id="go">${s.connected ? tr('reconnect') : tr('connect')}</button>
    <button class="secondary" id="browser">${tr('apple_browser')}</button>
    <p id="error" class="err" hidden></p>`;
  const start = await call('appleStart');
  const go = document.getElementById('go');
  go.onclick = async () => {
    go.disabled = true;
    try {
      const token = await appleAuthorize(start.developerToken);
      await call('appleFinish', { token });
      app.innerHTML = `<h1>${tr('done')}</h1>`;
      setTimeout(() => tg.close(), 1500);
    } catch (e) { showError(e); go.disabled = false; }
  };
  // Popups can be blocked inside Telegram: the browser flow ends with /connect.
  document.getElementById('browser').onclick = () => {
    tg.openLink(`${location.origin}/?p=apple-browser#s=${start.state}&dt=${encodeURIComponent(start.developerToken)}`);
  };
}

async function appleBrowserView(params) {
  app.innerHTML = `<h1>${tr('apple_title')}</h1><p class="hint">${tr('apple_hint')}</p><button id="go">${tr('connect')}</button><p id="error" class="err" hidden></p>`;
  const go = document.getElementById('go');
  go.onclick = async () => {
    go.disabled = true;
    try {
      const token = await appleAuthorize(params.get('dt'));
      sendToBot(`/connect ${params.get('s')} ${token}`);
    } catch (e) { showError(e); go.disabled = false; }
  };
}

// --- Router ----------------------------------------------------------------------------
(async () => {
  // The page is opened as /?p=spotify or /?p=apple; Telegram puts its own data in the hash.
  const route = new URLSearchParams(location.search).get('p');
  const params = new URLSearchParams(location.hash.slice(1));
  try {
    if (route === 'apple-browser') return appleBrowserView(params);
    if (!tg?.initData) { app.innerHTML = `<p>${tr('open_from_bot')}</p>`; return; }
    const state = await call('getState');
    if (route === 'apple') return appleView(state);
    return spotifyView(state);
  } catch (e) {
    app.innerHTML = '<p id="error" class="err"></p>';
    showError(e);
  }
})();
</script>
</body>
</html>
