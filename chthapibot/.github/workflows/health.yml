# Daily API healthcheck from the platform; failures are sent to the admin chat
# (set with: npx tgcloud run endpoints/setConfig '{ admin_chat_id: "<your id>" }').
name: healthcheck

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx tgcloud run endpoints/healthcheck '{ notify: true }'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
