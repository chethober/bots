<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0F1A12"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#00B34A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- faint dots -->
  <circle cx="120" cy="140" r="38" fill="#39FF88" opacity="0.07"/>
  <circle cx="520" cy="520" r="54" fill="#39FF88" opacity="0.06"/>
  <circle cx="540" cy="150" r="20" fill="#39FF88" opacity="0.10"/>
  <!-- speech bubble -->
  <path d="M170 170 h300 a60 60 0 0 1 60 60 v150 a60 60 0 0 1 -60 60 h-150 l-80 70 v-70 h-70 a60 60 0 0 1 -60 -60 v-150 a60 60 0 0 1 60 -60 z" fill="url(#green)" filter="url(#glow)"/>
  <!-- masquerade mask -->
  <path d="M206 262 q114 -42 228 0 q4 58 -38 82 q-40 18 -70 -22 q-6 -8 -6 -8 q0 0 -6 8 q-30 40 -70 22 q-42 -24 -38 -82 z" fill="#000"/>
  <ellipse cx="270" cy="292" rx="30" ry="18" fill="url(#green)"/>
  <ellipse cx="370" cy="292" rx="30" ry="18" fill="url(#green)"/>
  <!-- smile -->
  <path d="M250 384 q70 34 140 0" stroke="#000" stroke-width="16" fill="none" stroke-linecap="round"/>
</svg>
