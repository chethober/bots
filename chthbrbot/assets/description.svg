      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.55" stop-color="#E9407A"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A2BE0"/>
      <stop offset="1" stop-color="#E9407A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
<g transform="translate(320 180) scale(0.62) translate(-320 -330)">
