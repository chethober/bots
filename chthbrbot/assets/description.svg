  <circle cx="120" cy="140" r="38" fill="#fff" opacity="0.14"/>
  <circle cx="520" cy="520" r="54" fill="#fff" opacity="0.12"/>
  <circle cx="540" cy="150" r="20" fill="#fff" opacity="0.18"/>
