<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2be0"/>
      <stop offset="1" stop-color="#1b0f5c"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e0f5"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f29f05"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="250" fill="#ffffff" opacity="0.06"/>
  <!-- chip behind -->
  <g transform="translate(410 400)">
    <circle r="120" fill="url(#chip)"/>
    <circle r="120" fill="none" stroke="#fff" stroke-width="22" stroke-dasharray="36 27" opacity="0.9"/>
    <circle r="78" fill="none" stroke="#b86e00" stroke-width="6" opacity="0.6"/>
    <text y="30" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="84" fill="#7a4300">G</text>
  </g>
  <!-- die in front -->
  <g transform="translate(250 270) rotate(-14)">
    <rect x="-140" y="-140" width="280" height="280" rx="56" fill="#000" opacity="0.25" transform="translate(10 16)"/>
    <rect x="-140" y="-140" width="280" height="280" rx="56" fill="url(#die)"/>
    <g fill="#e5484d">
      <circle cx="-70" cy="-70" r="26"/>
      <circle cx="0" cy="0" r="26"/>
      <circle cx="70" cy="70" r="26"/>
      <circle cx="70" cy="-70" r="26"/>
      <circle cx="-70" cy="70" r="26"/>
    </g>
  </g>
</svg>
