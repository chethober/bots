<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chth Games</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <button class="back hidden" id="back" aria-label="Back">‹</button>
    <div class="who">
      <div class="name" id="name">Chth Games</div>
      <div class="bal"><span class="coin-ico"></span><b id="bal">—</b></div>
    </div>
    <button class="pill" id="shop" aria-label="Buy chips">💎</button>
    <button class="pill" id="daily" disabled>🎁 Daily</button>
  </header>
  <main id="screen"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
