name = "cve-telegram-notifier"
main = "src/index.js"
compatibility_date = "2024-03-01"
compatibility_flags = [ "nodejs_compat" ]


# Run the CVE check cron job every 10 minutes
[triggers]
crons = ["*/10 * * * *"]

# Cloudflare D1 Database (Serverless SQLite)
[[d1_databases]]
binding = "DB"
database_name = "cve-db"
database_id = "4aab0e98-6801-4dae-a1d6-53f07f2ddfdb"

# Non-secret configuration. The bot token is NOT here — it is a Wrangler secret:
#   wrangler secret put TELEGRAM_BOT_TOKEN
# For local dev, put it in .dev.vars (git-ignored). See .env.example.
[vars]
TELEGRAM_ADMIN_ID = "8028710032,6330862227"
TELEGRAM_CHAT_ID = "8028710032"
MIN_CVSS_SCORE = "7.6"
MIN_EPSS_SCORE = "0.15"
